<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engelbart — Sidebar</title>
<!--
  The sidebar, redone from Hudson's "Sidebar" workspace (2026-10-13). One file, no build step, sample data only.
  What it follows, top to bottom:
    title bar   traffic lights, the sidebar toggle and the clock (Recent pages) on one row, their centre on the same line
                as the tabs and Stage / Terminal; the project head right under it, no gap.
    head        the top-level project and its chevron: Switch project ›, Rename, Project page ↗; then Settings and New note.
    fixed rows  Agents, Library, Search. Connections and Starred are gone. Agents use a number in a rectangle:
                an unfilled pulsing outline while any agent is running, a solid grey fill when only results await viewing.
                Projects use bare counts: pulsing grey while running, steady dark when ready, without a box or border.
                Both count running and unviewed agents together and cap at 9+.
    Projects    nested to a fourth level (level 1 is the switcher). At most three direct children of the root, and ten
                rows altogether, counting descendants and More. The shortlist and tree order stay put when clicked.
                Only one branch at each level can be expanded. More opens the rest beside the sidebar.
                Ctrl+1–9 opens only second-level projects, in their root's order, including projects in More.
                Second-level projects keep their icon; number hints appear only in the shortcuts menu. Cmd+J opens the next agent needing attention.
                Both commands are shown in the sidebar and in Keyboard shortcuts under the project menu.
                Only the deepest open group's children get a guide line. A plus appears on hover.
                Counts stay visible, aligned immediately before the chevron column.
                Every parent includes all descendants in its total, expanded or folded, including the root picker.
                Hovering a folded project for a beat shows its children; leaving closes it.
    Sources     folded unless this project has something; Add sources, Notes with a + (and "+ Note" when there are none), then
                the rest with their own icons: picture, code (html), globe (website), folder, paper (pdf), repository.
    foot        stickies shown or hidden, and the trash.
  Chevrons: down while open, up while folded.
-->
<style>
:root{
  --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ink:#171717;--body:#262626;--mut:#4d4d4d;--icon:#5c5c5c;--fnt:#8f8f8f;--bd:#eaeaea;--bd2:#c9c9c9;
  --rail:#fafafa;--hov:#efefef;--active:#e6e6e6;--blue:#0070f3;--red:#e70022;
  --ease:cubic-bezier(.25,.1,.25,1);
  --rail-w:288px;--line:30px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font:14px/1.4 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(0,112,243,.28)}
svg{flex:none;display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes status-outline{0%,100%{border-color:#8f8f8f}50%{border-color:#eaeaea}}
@keyframes number-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes added{0%{background:#e6f0fd}100%{background:transparent}}
.panel.still,.dialog.still{animation:none}
@media(prefers-reduced-motion:reduce){.status-pill.running,.project-count.in-progress{animation:none!important}}

/* ---------------------------------------------------------------- frame */
.app{display:flex;height:100vh;min-width:0}
.rail{flex:none;width:var(--rail-w);display:flex;flex-direction:column;min-height:0;padding:0 8px;background:var(--rail);border-right:1px solid var(--bd);position:relative;z-index:5}
.app[data-rail="hidden"] .rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--rail)}
.stage{flex:none;width:300px;display:flex;flex-direction:column;border-left:1px solid var(--bd);background:var(--rail)}

/* Every top row is 40px and puts its middle at 23px, so the lights, the toggle, the clock, a tab's name and "Stage" share a line. */
.titlebar{flex:none;display:flex;align-items:center;gap:2px;height:40px;padding-top:6px}
.lights{display:flex;gap:8px;padding:0 12px 0 5px}
.light{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;color:var(--icon);transition:background 120ms,color 120ms}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:#ececec;color:var(--ink)}

.tabbar{flex:none;display:flex;align-items:flex-end;height:40px;padding:0 8px;border-bottom:1px solid var(--bd);position:relative}
.tabbar .titlebar{height:34px;padding:0;align-self:flex-end;margin-bottom:0;margin-right:6px}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:34px;max-width:200px;padding:0 10px 0 12px;margin-bottom:-1px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--mut);font:13px/1 var(--font-sans);cursor:pointer;white-space:nowrap}
.tab span.t{overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink)}
.tab[data-on="1"]{background:#fff;border-color:var(--bd);color:var(--ink);font-weight:500}
/* The open tab joins the page under it: no line under it, and its foot flares into the bar on both sides. */
.tab[data-on="1"]::before,.tab[data-on="1"]::after{content:"";position:absolute;bottom:0;width:8px;height:8px;pointer-events:none}
.tab[data-on="1"]::before{left:-9px;background:radial-gradient(circle at 0 0,transparent 7.5px,var(--bd) 7.5px,var(--bd) 8.5px,#fff 8.5px)}
.tab[data-on="1"]::after{right:-9px;background:radial-gradient(circle at 100% 0,transparent 7.5px,var(--bd) 7.5px,var(--bd) 8.5px,#fff 8.5px)}
.tab .x{display:flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:4px;color:var(--fnt);opacity:0}
.tab:hover .x,.tab[data-on="1"] .x{opacity:1}
.tab .x:hover{background:#ececec;color:var(--ink)}
.tab-plus{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:0 0 4px 4px;border-radius:6px;color:var(--icon)}
.tab-plus:hover{background:#ececec;color:var(--ink)}
.canvas{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
.page{max-width:620px;margin:0 0 0 max(40px,calc((100% - 860px)/2));padding:56px 0 120px}
.page h1{margin:0;font:500 28px/1.25 var(--font-sans);letter-spacing:-.4px}
.page .kicker{display:flex;align-items:center;gap:7px;margin-bottom:14px;font:500 9.5px/1 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--fnt)}
.page p{margin:14px 0 0;font:15px/1.7 var(--font-sans);color:var(--mut)}
.page .bar{height:10px;margin-top:16px;border-radius:5px;background:#f2f2f2}
.page .kids{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px}
.page .kid{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;font:13.5px/1 var(--font-sans);color:var(--body);cursor:pointer}
.page .kid:hover{border-color:var(--bd2)}
.sticky{position:absolute;right:28px;top:64px;width:156px;min-height:136px;padding:14px 14px 16px;background:#fff2a8;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);font:13px/1.55 var(--font-sans);color:#4a4020;transform:rotate(1.2deg)}
.app[data-stickies="hidden"] .sticky{display:none}
.stage-head{flex:none;display:flex;align-items:center;gap:16px;height:40px;padding:7px 16px 0;border-bottom:1px solid var(--bd)}
.stage-head span{font:13px/1 var(--font-sans);color:var(--fnt);cursor:default}
.stage-head span[data-on="1"]{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1.5px}
.stage-body{flex:1;display:flex;align-items:center;justify-content:center;font:13px/1.5 var(--font-sans);color:#b3b3b3;background:#fff}

/* ---------------------------------------------------------------- sidebar */
.head{flex:none;display:flex;align-items:center;gap:2px;height:36px}
.picker{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;font:600 15px/1 var(--font-sans);color:var(--ink)}
.picker:hover,.picker[aria-expanded="true"]{background:#ececec}
.picker .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1 0 4px}
.scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;padding-bottom:4px}
.scroll::-webkit-scrollbar{display:none}
.fixed{flex:none;display:flex;flex-direction:column;gap:1px;padding-top:4px}

.row{flex:none;position:relative;display:flex;align-items:center;height:var(--line);padding:0 6px 0 8px;border-radius:6px;cursor:pointer;outline:none;transition:background 120ms;user-select:none}
.row:hover{background:var(--hov)}
.row[data-active="1"]{background:var(--active)}
.row[data-active="1"]:hover{background:#e0e0e0}
.row[data-flash="1"]{animation:added 1600ms ease-out}
.row .ic{flex:none;width:18px;height:18px;margin-right:10px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.row .lb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 14.5px/30px var(--font-sans);color:var(--body)}
.row[data-active="1"] .lb,.row[data-holds="1"] .lb{color:var(--ink);font-weight:500}
.row[data-active="1"] .ic{color:var(--ink)}
.row.in{padding-left:10px}
.row.in .lb{font-size:13.5px;color:var(--mut)}
.row.in[data-active="1"] .lb,.row.in[data-holds="1"] .lb{color:var(--ink)}
.row .faint{color:#9b9b9b!important}
.row .sp{flex:1 0 6px}
.row .rt{flex:none;display:flex;align-items:center;gap:6px;margin-left:4px}
.row .hv{flex:none;display:flex;align-items:center;gap:1px;opacity:0;transition:opacity 120ms}
.row:hover .hv{opacity:1}
.act{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--fnt)}
.act:hover{background:#e3e3e3;color:var(--ink)}
.chev{flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:2px;border-radius:4px;color:#9b9b9b}
.chev:hover{background:#e0e0e0;color:var(--mut)}
.chev svg{transition:transform 160ms var(--ease)}
.chev.on-hover{opacity:0;pointer-events:none}
:is(.row,.prow):is(:hover,:focus-within) .chev.on-hover{opacity:1;pointer-events:auto}
/* Down while open, up while folded (Hudson: "the chevrons should point up when they point down and vice versa"). */
.chev[data-open="0"] svg,.sec-toggle[data-open="0"] .chev-mark svg{transform:rotate(180deg)}
.chev-mark{display:flex;color:#9b9b9b}
.more .lb,.more .ic{color:var(--fnt)!important}
.more:hover .lb,.more:hover .ic{color:var(--mut)!important}
.status-pill{flex:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:22px;height:22px;padding:0 3px;border:1px solid transparent;border-radius:4px;font:400 12px/1 var(--font-sans);font-variant-numeric:tabular-nums;text-align:center}
.status-pill.ready{background:var(--bd);color:var(--ink)}
.status-pill.running{background:transparent;color:var(--mut);border-color:var(--bd2);animation:status-outline 1.8s ease-in-out infinite}
.project-count{flex:none;display:inline-block;min-width:12px;text-align:center;font:400 12px/16px var(--font-sans);font-variant-numeric:tabular-nums}
.project-count.done{color:var(--ink)}
.library-count{flex:none;color:var(--fnt);font:400 12px/16px var(--font-sans);font-variant-numeric:tabular-nums;margin-left:6px}
.project-count.in-progress{color:var(--fnt);animation:number-pulse 1.8s ease-in-out infinite}
.shortcut{flex:none;color:var(--fnt);font:12px/1.4 var(--font-sans);white-space:nowrap;font-variant-numeric:tabular-nums}
.project-tools{flex:none;display:flex;align-items:center;gap:5px;margin-left:6px}
.status-slot{display:flex;align-items:center;justify-content:center;flex:none;width:22px}
.chevron-slot{display:flex;align-items:center;justify-content:center;flex:none;width:18px}
.chevron-slot .chev{margin-left:0}
.project-slot{display:grid;place-items:center;flex:none;width:22px;height:22px}
.project-slot>*{grid-area:1/1}.project-slot .act{visibility:hidden;pointer-events:none}
.row:hover .project-slot.can-add .act,.row:focus-within .project-slot.can-add .act{visibility:visible;pointer-events:auto}
.more .ic{width:auto;height:auto;display:block;line-height:30px;margin-right:4px!important}
.more-mark{font:400 14px/30px var(--font-sans);letter-spacing:0;display:inline}
.sec-command{margin-left:auto;margin-right:8px;border-radius:4px;padding:2px 3px}.sec-command:hover{background:var(--hov);color:var(--mut)}
.command-row{display:flex;align-items:center;gap:20px;min-height:38px;padding:8px 14px;font-size:13.5px}.command-row .shortcut{margin-left:auto}
.agent-detail{width:100%;align-self:stretch;padding:20px 16px;color:var(--ink);outline:none}.agent-detail h2{margin:8px 0 12px;font:500 16px/1.4 var(--font-sans)}.agent-detail p{margin:12px 0;font:13px/1.6 var(--font-sans);color:var(--mut)}.agent-detail .path{font:12px/1.5 var(--font-sans);color:var(--fnt)}.agent-detail .state{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fnt)}

.sec{flex:none;display:flex;flex-direction:column}
.sec-head{flex:none;display:flex;align-items:center;height:var(--line);padding:0 6px 0 8px;margin-top:12px}
.sec-toggle{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 0;font:500 13px/1.4 var(--font-sans);color:var(--fnt)}
.sec-toggle:hover{color:var(--mut)}
.sec-head .act{opacity:1}
.empty-line{height:var(--line);display:flex;align-items:center;padding-left:10px;font:13px/1 var(--font-sans);color:#a3a3a3}

/* A project's children: indented under its name; a faint guide line only beside the level you are on. */
.kids{position:relative;display:flex;flex-direction:column;padding-left:22px}
.kids.l3{padding-left:24px}
.kids[data-guide="1"]::before{content:"";position:absolute;left:15.5px;top:2px;bottom:2px;width:1px;background:#dcdcdc}
.kids.l4[data-guide="1"]::before{left:10.5px}
.kids.l4{padding-left:22px}
/* The tree keeps its ordinary surface; only the selected row is highlighted. */
.branch{display:flex;flex-direction:column}
.ws-list{display:flex;flex-direction:column;gap:0}

.group-head{flex:none;display:flex;align-items:center;height:var(--line);padding:0 6px 0 8px;border-radius:6px}
.group-head .ic{flex:none;width:18px;height:18px;margin-right:10px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.group-head .lb{font:500 14.5px/30px var(--font-sans);color:var(--body)}
.notes{position:relative;display:flex;flex-direction:column;padding-left:24px}
.notes::before{content:"";position:absolute;left:15.5px;top:2px;bottom:2px;width:1px;background:#e3e3e3}
.plus-note{display:flex;align-items:center;gap:6px;height:var(--line);padding:0 10px;border-radius:6px;font:13.5px/1 var(--font-sans);color:var(--fnt)}
.plus-note:hover{background:var(--hov);color:var(--ink)}
.files{display:flex;flex-direction:column;margin-top:4px}
.source-children{display:flex;flex-direction:column;padding-left:24px}
.source-folder .source-tools{display:flex;align-items:center;gap:2px}
.source-folder .source-tools .act{visibility:hidden}
.source-folder:is(:hover,:focus-within) .source-tools .act{visibility:visible}
.source-folder .chev{margin-left:0}
.source-create .ic{position:relative}
.source-create .folder-plus{position:absolute;right:-3px;bottom:-2px;background:var(--rail);font:16px/12px var(--font-sans)}
.row:focus-within .hv{opacity:1}
.foot{flex:none;display:flex;align-items:center;gap:2px;margin:6px 0 10px}
.foot .row{flex:1}

/* ---------------------------------------------------------------- floating */
#layer>*,#hover-layer>*,#tooltip-layer>*{position:fixed}
.panel{z-index:80;display:flex;flex-direction:column;background:#fff;border:1px solid #e6e6e6;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);animation:rise 140ms var(--ease);overflow:hidden}
.panel-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.panel-head b{font:600 13px/1.4 var(--font-sans)}
.panel-head i{font:normal 12px/1.4 var(--font-sans);color:var(--fnt)}
.panel-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 6px 8px}
.pgroup{padding:10px 10px 4px;font:500 12px/1.4 var(--font-sans);color:var(--fnt)}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border-radius:6px;cursor:pointer}
.prow:hover,.prow[data-sel="1"]{background:#f3f3f3}
.prow[data-active="1"]{background:#ececec}
.prow .ic{flex:none;width:18px;display:flex;justify-content:center;color:var(--mut)}
.prow .tx{flex:1;min-width:0}
.prow .t1{font:14px/1.35 var(--font-sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow[data-active="1"] .t1{font-weight:500}
.prow .t2{margin-top:1px;font:12px/1.35 var(--font-sans);color:var(--fnt);overflow:hidden;white-space:nowrap;text-overflow:clip}
.prow .rt{flex:none;display:flex;align-items:center;gap:6px;font:12px/1 var(--font-sans);color:var(--fnt)}
.menu{padding:5px;gap:1px}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:6px;font:13.5px/1 var(--font-sans);color:var(--ink);cursor:pointer}
.mi:hover,.mi[data-open="1"]{background:#f2f2f2}
.mi .ic{display:flex;color:var(--mut)}
.mi .r{margin-left:auto;display:flex;color:var(--fnt)}
.mi[data-danger="1"]:hover{color:var(--red)}
.mi[disabled]{opacity:.4;cursor:default;background:transparent!important}
.sep{height:1px;margin:4px 6px;background:#efefef}
.field{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:#fff;transition:border-color 120ms}
.field:focus-within{border-color:var(--bd2)}
.field input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:14px/1.5 var(--font-sans);color:var(--ink)}
.field input::placeholder{color:#a3a3a3}
.field[data-error="1"]{border-color:var(--red)}
.added-list{padding:0 0 4px}
.added-row{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;font:13.5px/1 var(--font-sans);color:var(--ink)}
.added-row .ic{display:flex;color:var(--mut)}
.err{padding:6px 2px 2px;font:12px/1.5 var(--font-sans);color:var(--red)}
.btn{height:30px;padding:0 12px;border:1px solid #e4e4e4;border-radius:7px;background:#fff;box-shadow:0 1px 1px #0000000a;font:500 13px/1 var(--font-sans);color:var(--ink);cursor:pointer;flex:none}
.btn:hover{border-color:var(--bd2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#333}
.btn[disabled]{opacity:.35;cursor:default}
.library-filters{display:flex;align-items:center;gap:4px;margin:0 10px 6px}
.library-filter{flex:none;padding:2px 8px;border:1px solid #eaeaea;border-radius:6px;background:transparent;color:#4d4d4d;cursor:pointer;white-space:nowrap;font:400 12px/1.4 var(--font-sans)}
.library-filter:hover{background:var(--hov)}
.library-filter[aria-pressed="true"]{border-color:#efefef;background:#efefef;color:#171717;font-weight:500}
.picker-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flyout{z-index:82;width:270px;padding:5px}
.fly-kids{position:relative;display:flex;flex-direction:column;padding-left:18px}
.fly-kids[data-guide="1"]::before{content:"";position:absolute;left:9px;top:2px;bottom:2px;width:1px;background:#e3e3e3}
.flyout .fly-context .t1{font-weight:500}
.project-tooltip{z-index:120;display:flex;align-items:center;gap:8px;width:240px;max-width:calc(100vw - 16px);padding:9px 10px;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.08);color:var(--mut);font:12px/1.4 var(--font-sans);pointer-events:none}
.project-tooltip .tip-key{flex:none;display:flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 4px;border:1px solid var(--bd);border-radius:4px;background:var(--rail);color:var(--ink);font:12px/1 var(--font-sans)}
.project-tooltip kbd{font:inherit;color:var(--ink);white-space:nowrap}
.project-tooltip.action-tooltip{width:auto;max-width:240px;white-space:nowrap}
.peek{z-index:95;width:340px;padding:14px 16px 16px;background:#fff;border:1px solid var(--bd2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.06);animation:rise 160ms var(--ease)}
.peek .k{display:flex;align-items:center;gap:7px;font:500 9px/1 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--fnt)}
.peek .n{margin-top:9px;font:500 14.5px/1.4 var(--font-sans)}
.peek .x{margin-top:8px;font:12.5px/1.7 var(--font-sans);color:var(--mut)}
.veil{z-index:300;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(23,23,23,.18)}
.veil.top{align-items:flex-start;padding-top:14vh;background:rgba(23,23,23,.12)}
.dialog{position:relative;background:#fff;border:1px solid #e2e2e2;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.16);animation:rise 160ms var(--ease);overflow:hidden}
.toast{z-index:400;left:50%;bottom:28px;transform:translateX(-50%);padding:9px 14px;border-radius:8px;background:var(--ink);color:#fff;font:13px/1.4 var(--font-sans);box-shadow:0 8px 24px rgba(0,0,0,.18);animation:rise 160ms var(--ease);pointer-events:none;max-width:520px;text-align:center}

/* Settings: the app's own window (src/renderer/ui/Settings.jsx), in the middle of the window. */
.settings{display:flex;width:min(780px,calc(100vw - 32px));height:min(540px,calc(100vh - 80px));background:#fcfcfc;border:1px solid #d4d4d4;border-radius:12px;box-shadow:0 16px 48px #00000024}
.s-nav{flex:none;width:200px;padding:16px 10px;border-right:1px solid #ebebeb;background:#f5f5f5;overflow-y:auto}
.s-search{position:relative;margin-bottom:12px}
.s-search input{width:100%;height:30px;padding:0 9px 0 30px;border:1px solid #e4e4e4;border-radius:7px;background:#fff;font:13px/1.4 var(--font-sans);outline:none}
.s-search svg{position:absolute;left:10px;top:8px;color:var(--fnt)}
.s-sec{padding:0 9px;margin:0 0 4px;font:500 12.5px/1.4 var(--font-sans);color:var(--fnt)}
.s-item{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 9px;border-radius:6px;font:13.5px/1.4 var(--font-sans);color:var(--ink)}
.s-item:hover{background:#ececec}
.s-item[aria-current="page"]{background:#e8e8e8;font-weight:500}
.s-item .ic{display:flex;color:#6f6f6f}
.s-item[aria-current="page"] .ic{color:var(--ink)}
.s-body{flex:1;min-width:0;overflow-y:auto;padding:30px 40px 36px}
.s-title{font:500 22px/1.4 var(--font-sans);letter-spacing:-.01em}
.s-group-head{margin:28px 0 10px;font:500 14px/1.4 var(--font-sans)}
.s-card{margin:0 -16px;border:1px solid #ebebeb;border-radius:10px;background:#fff;box-shadow:0 1px 2px #00000008}
.s-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 16px}
.s-row+.s-row{border-top:1px solid #efefef;margin:0 16px;padding:10px 0}
.s-row .ic{display:flex;width:18px;color:var(--mut)}
.s-row .lbl{flex:1;min-width:0;font:500 13.5px/1.4 var(--font-sans)}
.s-row .st{font:12.5px/1.4 var(--font-sans);color:var(--fnt)}
.sel{position:relative;display:inline-block}
.sel select{height:30px;padding:0 26px 0 10px;border:1px solid #e4e4e4;border-radius:7px;background:#fff;box-shadow:0 1px 1px #0000000a;appearance:none;-webkit-appearance:none;cursor:pointer;font:13px/1.4 var(--font-sans);outline:none}
.sel select:hover{border-color:var(--bd2)}
.sel svg{position:absolute;right:8px;top:10px;pointer-events:none;color:var(--fnt)}
.close-x{position:absolute;top:14px;right:16px;width:26px;height:26px;border-radius:6px;font:18px/26px var(--font-sans);color:var(--fnt);text-align:center}
.close-x:hover{color:var(--ink)}

/* The mockup's own controls, kept out of the way. */
.mock{position:fixed;z-index:200;right:316px;bottom:14px;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed #d6d6d6;border-radius:10px;background:rgba(255,255,255,.92);font:12px/1.4 var(--font-sans);color:var(--mut)}
.mock b{font:500 9px/1 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--fnt)}
.mock .r{display:flex;gap:6px;flex-wrap:wrap;max-width:330px}
.mock button{height:26px;padding:0 9px;border:1px solid #e4e4e4;border-radius:6px;background:#fff;font:12px/1 var(--font-sans)}
.mock button:hover{border-color:var(--bd2)}
.mock[data-folded="1"] .r{display:none}
</style>

</div>
<div id="layer"></div>
<div id="hover-layer"></div>

<div class="mock" id="mock" data-folded="0">

</div>

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  item('berkeley', 'Mathetic-PBC/berkeley-research', 'git');
  item('canvas-focus', 'Canvas focus regression', 'note', 'Typing in the canvas loses focus after a popup closes.');
  item('graham', 'Graham', 'note', 'Chats about things, writes something. “I have some vague understanding.”');
  item('sandbox-note', 'Engelbart sandbox', 'note', 'Builds lack an Engelbart-specific sandbox: E2B in src/main/sandbox/ is for GitHub previews.');

  SOURCES = {
    'engelbart': ['welcome', 'install'],
    'engelbart/user-interface/sidebar': ['copy-button', 'mc-overview', 'sb-reqs', 'sb-brainstorm', 'iconography', 'switch-projects', 'att-1', 'nav-board', 'mockup', 'nav-patterns', 'refs'],

    'engelbart/agents/bart-build-agents/sandbox': ['sandbox-note'],

  // Agents: needs (waiting on you), unseen (finished, not looked at), running, done (finished and seen).
  AGENTS = [

/* ================================================================ floating */
let open = null;   // the one panel or dialog open: { kind, ... }
let hover = null;  // { kind: 'fly'|'peek', id, rect }
let hoverTimer = null;
let addDismissTimer = null;
let shortcutTip = null, shortcutTimer = null, shortcutAnchor = null;
const railRight = () => ($('#rail').getBoundingClientRect().right || 0);
function clearShortcutTip() { clearTimeout(shortcutTimer); shortcutTimer = null; shortcutAnchor = null; shortcutTip = null; }
function clearAddDismissal() { clearTimeout(addDismissTimer); addDismissTimer = null; }
function closeAll() { clearAddDismissal(); open = null; hover = null; clearTimeout(hoverTimer); clearShortcutTip(); }
function scheduleAddDismissal() {
  if (!open || open.kind !== 'add' || addDismissTimer != null) return;
  const picker = open;
  addDismissTimer = setTimeout(() => {
    addDismissTimer = null;
    if (open !== picker) return;
    closeAll(); render();
  }, PEEK_CLOSE);
}
function updateAddBoundary(event) {
  if (!open || open.kind !== 'add') { clearAddDismissal(); return; }
  const rects = [...document.querySelectorAll('[data-add-picker], [data-picker-library], #hover-layer [data-hover-layer]')].map(el => el.getBoundingClientRect());
  if (open.anchor) rects.push(open.anchor);
  const inside = rects.some(rect => event.clientX >= rect.left - 12 && event.clientX <= rect.right + 12 && event.clientY >= rect.top - 12 && event.clientY <= rect.bottom + 12);
  if (inside) clearAddDismissal(); else scheduleAddDismissal();
}
function renderProjectTooltip() {
  $('#tooltip-layer').innerHTML = shortcutTip && (!open || shortcutTip.kind === 'create') ? projectShortcutTip() : '';
}
function updateShortcutTip(event) {
  const row = event.target.closest('#rail [data-shortcut-project]');
  const action = event.target.closest('[data-create-tooltip]');
  const anchor = action || row;
  if (!anchor || (open && !action) || (!action && event.target.closest('.chev, .act'))) {
    const changed = !!shortcutTip;
    clearShortcutTip();
    if (changed) renderProjectTooltip();
    return;
  }
  if (shortcutAnchor === anchor) return;
  const changed = !!shortcutTip;
  clearShortcutTip();
  shortcutAnchor = anchor;
  if (changed) renderProjectTooltip();
  shortcutTimer = setTimeout(() => {
    if (!anchor.isConnected) return;
    shortcutTip = { id: action ? action.dataset.createTooltip : row.dataset.shortcutProject, kind: action ? 'create' : 'switch', rect: rectOf(anchor) };
    renderProjectTooltip();
  }, PEEK_OPEN);
}
function projectShortcutTip() {
  if (!shortcutTip) return '';
  const number = shortcutFor(shortcutTip.id);
  if (!number && shortcutTip.kind !== 'create') return '';
  const rect = shortcutTip.rect;
  const left = Math.max(8, Math.min(rect.left + 28, window.innerWidth - 248));
  const top = rect.bottom + 48 <= window.innerHeight ? rect.bottom + 5 : Math.max(8, rect.top - 45);
  if (shortcutTip.kind === 'create') return `<div class="project-tooltip action-tooltip" role="tooltip" style="left:${left}px;top:${top}px">Create project within ${esc(N[shortcutTip.id].name)}</div>`;
  return `<div class="project-tooltip" role="tooltip" style="left:${left}px;top:${top}px"><span class="tip-key">⌃${number}</span><span>Toggle project with <kbd>Ctrl + ${number}</kbd></span></div>`;
}
function place(anchorRect, { side = 'right', width, gap = 8, maxH = 560 }) {
  const vh = window.innerHeight, vw = window.innerWidth;
  let left, top;
  if (side === 'right') { left = Math.max(railRight(), anchorRect.right) + gap; top = anchorRect.top - 6; }
  else { left = anchorRect.left; top = anchorRect.bottom + gap; }
  left = Math.min(left, vw - width - 8);
  top = Math.max(8, Math.min(top, vh - Math.min(maxH, vh * 0.7) - 8)); // at the row's height, unless that leaves it too little room
  return `left:${left}px;top:${top}px;width:${width}px;max-height:${Math.min(maxH, vh - top - 8)}px`;
}
function renderHoverLayer() {
  const hidden = open && ['settings', 'search', 'create', 'source-folder'].includes(open.kind);
  $('#hover-layer').innerHTML = hover && !hidden ? (hover.kind === 'fly' ? flyout() : peekCard()) : '';
}
function renderLayer(typing = false) {
  const L = $('#layer');
  let html = '';
  if (open) html += ({ project: projectMenu, agents: agentsPanel, library: libraryPanel, add: addPanel, clock: clockPanel, 'all-projects': allProjectsPanel, siblings: siblingsPanel, sources: sourcesPanel, trash: trashPanel, settings: settingsDialog, search: searchDialog, create: createDialog, 'source-folder': sourceFolderDialog, commands: commandsDialog, menu: contextMenu }[open.kind] || (() => ''))();
  if (open && open.kind === 'add' && open.library) html += libraryPanel(open.library, true);
  if (toastText) html += `<div class="toast">${esc(toastText)}</div>`;
  // Whatever field was being typed in keeps its caret through the redraw; a panel's first field takes the keyboard once.
  const was = document.activeElement, key = was && was.dataset && was.dataset.input;
  const caret = key ? [was.selectionStart, was.selectionEnd] : null;
  L.innerHTML = html;
  if (typing) L.querySelectorAll('.panel,.dialog').forEach((el) => el.classList.add('still'));
  renderHoverLayer();
  renderProjectTooltip();
  fitCrumbs();
  const again = key && L.querySelector(`[data-input="${key}"]`);
  if (again) { again.focus(); again.setSelectionRange(caret[0], caret[1]); return; }
  const focus = L.querySelector('[data-autofocus]');
  if (focus && open && !open.focused) { open.focused = true; focus.focus(); }
}

const LIBRARY_FILTERS = [
  ['all', 'All'], ['notes', 'Notes'], ['papers', 'Papers'],
  ['repos', 'Repos'], ['web', 'Web'], ['files', 'Files'],
];
function libraryItems(q = '', filter = 'all') {
  const categories = { notes: ['note'], papers: ['pdf'], repos: ['git'], web: ['website', 'html'] };
  const categorized = Object.values(categories).flat();
  const query = q.trim().toLowerCase();
  return Object.values(ITEMS).filter(it => it.kind !== 'image'
    && (filter === 'all' || (filter === 'files' ? !categorized.includes(it.kind) : (categories[filter] || []).includes(it.kind)))
    && (!query || it.name.toLowerCase().includes(query)));
}
function libraryCount() {
  const total = libraryItems().length;
  return total > 999 ? '999+' : total;
}
function folderContains(id, target, seen = new Set()) {
  if (id === target) return true;
  if (seen.has(id)) return false;
  seen.add(id);
  return (ITEMS[id]?.children || []).some(child => folderContains(child, target, seen));
}
function canPickSource(id) {
  if (!ITEMS[id]) return false;
  const folder = open.folder || 'project';
  const attached = folder === 'project' ? [...(SOURCES[scope()] || []), ...S.sharedSourceFolders] : sourceChildren(folder);
  return !attached.includes(id) && !folderContains(id, folder);
}
function libraryPanel(state = open, picking = false) {
  const q = (state.q || '').toLowerCase();
  const filter = state.filter || 'all';
  const list = libraryItems(q, filter).filter(it => !picking || canPickSource(it.id));
  const inHere = new Set([...(SOURCES[scope()] || []), ...S.sharedSourceFolders]);
  return `<div class="panel" data-layer="1" ${picking ? 'data-picker-library="1"' : ''} style="${place(state.anchor, { width: 360 })}">
    <div class="panel-head"><b>Library</b><i>${libraryCount()}</i>${picking ? '<span class="grow"></span><button class="act" data-act="close-picker-library" aria-label="Close library">' + I('close', 14) + '</button>' : ''}</div>
    <div style="padding:2px 12px 6px"><div class="field">${I('search', 14, 2.4)}<input data-autofocus data-input="${picking ? 'picker-library-q' : 'library-q'}" placeholder="Search the library" value="${esc(state.q || '')}"></div></div>
    <div class="library-filters" role="toolbar" aria-label="Show only">${LIBRARY_FILTERS.map(([id, label]) => `<button class="library-filter" data-act="${picking ? 'picker-library-filter' : 'library-filter'}" data-id="${id}" aria-pressed="${filter === id}">${label}</button>`).join('')}</div>
    ${!q ? `<div class="pgroup">Recent${filter === 'all' ? '' : ` ${filter === 'web' ? 'web pages' : filter}`}</div>` : ''}
    <div class="panel-scroll">${list.map((it) => `<div class="prow" data-act="${picking ? 'pick-source' : 'open-item'}" data-id="${it.id}" data-peek="${it.id}" role="button" tabindex="0"><span class="ic">${I(KIND_ICON[it.kind], 16)}</span><div class="tx"><div class="t1">${esc(it.name)}</div></div>${picking ? '' : `<span class="rt">${inHere.has(it.id) ? 'In this project' : `<button class="act" data-act="link-item" data-id="${it.id}" title="Bring into this project" aria-label="Bring ${esc(it.name)} into this project">${I('plus', 14)}</button>`}</span>`}</div>`).join('') || '<div style="padding:8px 14px;color:#8f8f8f;font-size:13px">Nothing matches</div>'}</div>
    <div style="border-top:1px solid #efefef;padding:8px 12px"><button class="btn" data-act="toast" data-text="Opens the whole library.">Open full library</button></div>
  </div>`;
}

/* The clock: the project page first, then the last pages you opened (projects at any level, and notes), tabs included. */
function clockPanel() {
  const topEntry = { kind: 'top', id: S.top };
  const rows = [topEntry, ...S.recent.slice().reverse().filter((r) => !(r.kind === 'top') && (r.kind === 'note' || N[r.id].top === S.top))].slice(0, RECENT_ROWS);
  const row = (r) => {
    const name = r.kind === 'note' ? ITEMS[r.id].name : N[r.id].name;
    const crumb = r.kind === 'project' ? ancestors(r.id).map((a) => a.name).join('/') : '';
    const st = r.kind === 'note' ? null : agentSummary(r.id, true);
    const onTab = S.tabs.some((t) => t.page.kind === r.kind && t.page.id === r.id);
    return `<div class="prow" data-act="go-recent" data-kind="${r.kind}" data-id="${esc(r.id)}" title="${onTab ? 'Open in a tab: goes to it' : 'Opens in a new tab'}">
      <span class="ic">${r.kind === 'top' ? I('layers', 17) : r.kind === 'note' ? I(KIND_ICON[ITEMS[r.id].kind], 17) : I('project', 17)}</span>
      <div class="tx"><div class="t1">${esc(name)}</div>${crumb ? `<div class="t2" data-crumb="${esc(crumb)}">${esc(crumb)}</div>` : ''}</div>
      <span class="rt">${mark(st, true)}</span>
    </div>`;
  };
  return `<div class="panel" data-layer="1" style="${place(open.anchor, { side: 'below', width: 330, gap: 4 })}">
    <div class="panel-head"><b style="font-weight:500;font-size:13.5px">Recent pages</b></div>
    <div class="panel-scroll" style="padding-top:0">${rows.map(row).join('')}</div>
  </div>`;
}
// A path that does not fit loses its front, a level at a time, to "./": Engelbart/User Interface → ./User Interface.
function fitCrumbs() {
  for (const el of document.querySelectorAll('#layer [data-crumb]')) {
    let parts = el.dataset.crumb.split('/');
    el.textContent = parts.join('/');
    while (el.scrollWidth > el.clientWidth + 1 && parts.length > 1) { parts = parts.slice(1); el.textContent = `./${parts.join('/')}`; }
  }
}

/* The section's More: every project here, as a tree, findable */
function treeRows(ids, depth, { q = '', folded = new Set(), expandAll = false, guideLevel = null, contextRoot = null } = {}) {
  return ids.map((id) => {
    const n = N[id];
    const match = !q || n.name.toLowerCase().includes(q) || n.children.some((k) => pathMatches(k, q));
    if (!match) return '';
    const isFolded = !expandAll && folded.has(id) && !q;
    const here = page().kind === 'project' && page().id === id;
    const kids = n.children.length && !isFolded ? `<div class="fly-kids" data-parent="${esc(id)}" data-guide="${n.level === guideLevel ? 1 : 0}" style="padding-left:${depth ? 18 : 22}px">${treeRows(n.children, depth + 1, { q, folded, expandAll, guideLevel, contextRoot })}</div>` : '';
    return `<div class="prow${id === contextRoot ? ' fly-context' : ''}" style="min-height:30px;padding:0 8px;gap:8px" data-act="open-project" data-id="${esc(id)}" data-active="${here ? 1 : 0}">
      ${n.level === 2 ? projectLead(id) : depth === 0 ? `<span class="ic" style="width:16px">${I('project', 15)}</span>` : ''}
      <div class="tx"><div class="t1" style="font-size:${depth ? 13.5 : 14}px;color:${depth ? '#4d4d4d' : '#171717'}">${esc(n.name)}</div></div>
      <span class="project-tools"><span class="status-slot">${mark(agentSummary(id, true), true)}</span>${expandAll ? '' : `<span class="chevron-slot">${n.children.length ? `<button class="chev${n.level > 1 && !descends(scope(), id) ? ' on-hover' : ''}" data-act="tree-fold" data-id="${esc(id)}" data-open="${isFolded ? 0 : 1}" aria-label="${isFolded ? 'Open' : 'Fold'} ${esc(n.name)}">${CHEV()}</button>` : ''}</span>`}</span>
    </div>${kids}`;
  }).join('');
}
const pathMatches = (id, q) => N[id].name.toLowerCase().includes(q) || N[id].children.some((k) => pathMatches(k, q));
function allProjectsPanel() {
  const top = N[S.top];
  const count = Object.values(N).filter((n) => n.top === S.top && n.level >= 2).length;

let toastText = '', toastTimer = null;
function toast(t) { toastText = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastText = ''; renderLayer(); }, 2400); renderLayer(); }

/* ================================================================== events */
const rectOf = (el) => { const r = el.getBoundingClientRect(); return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width }; };
function openPanel(kind, el, extra = {}) {
  clearAddDismissal();
  if (open && open.kind === kind && (extra.id == null || open.id === extra.id) && (extra.key == null || open.key === extra.key) && (extra.folder == null || open.folder === extra.folder)) { open = null; render(); return; }
  hover = null;
  open = { kind, anchor: el ? rectOf(el.closest('.row, button') || el) : null, ...extra };
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  e.stopPropagation();
  switch (act) {
    case 'rail': S.railHidden = !S.railHidden; closeAll(); render(); break;
    case 'clock': openPanel('clock', t); break;
    case 'project-menu': openPanel('project', t); break;
    case 'switch-sub': { const r = rectOf(t); open.sub = { left: r.left, right: r.right, top: r.top - 5, bottom: r.bottom }; renderLayer(); break; }
    case 'switch-top': {
      if (id !== S.top) {
        S.lastIn[S.top] = scopeNode() ? scope() : S.lastIn[S.top];
        S.top = id;
        const back = S.lastIn[id];
        S.tabs = [{ page: { kind: 'top', id }, scope: id }];
        S.tab = 0;
        if (back) { S.tabs.push({ page: { kind: 'project', id: back }, scope: back }); S.tab = 1; openPath(back); } else S.expanded = new Set();
        remember('top', id);
      }
      closeAll(); render(); break;
    }
    case 'project-page': go({ kind: 'top', id: S.top }, { newTab: true }); break;
    case 'rename-top': { closeAll(); S.renamingTop = true; render(); const f = $('[data-rename-top]'); if (f) { f.focus(); f.select(); } break; }
    case 'new-top': closeAll(); render(); toast('Opens New project: a name, a description and a folder.'); break;
    case 'settings': hover = null; open = { kind: 'settings' }; render(); break;
    case 'settings-page': S.settingsPage = id; renderLayer(); break;
    case 'search': hover = null; open = { kind: 'search', q: '', idx: 0 }; render(); break;
    case 'commands': hover = null; open = { kind: 'commands' }; render(); break;
    case 'next-agent': nextAgent(); break;
    case 'agents': openPanel('agents', t); break;
    case 'library': openPanel('library', t, { q: '' }); break;
    case 'library-filter': if (open && open.kind === 'library' && LIBRARY_FILTERS.some(([key]) => key === id)) { open.filter = id; hover = null; renderLayer(); } break;
    case 'picker-library-filter': if (open && open.kind === 'add' && open.library && LIBRARY_FILTERS.some(([key]) => key === id)) { open.library.filter = id; hover = null; renderLayer(); } break;
    case 'picker-more': showPickerLibrary(rectOf(t.closest('[data-add-picker]'))); break;
    case 'close-picker-library': if (open && open.kind === 'add') { open.library = null; renderLayer(); } break;
    case 'pick-source': if (open && open.kind === 'add' && canPickSource(id)) { attachSource(id, open.folder || 'project'); (open.added = open.added || []).push(id); render(true); } break;
    case 'add': openPanel('add', t, { value: '', error: '', folder: t.dataset.folder || 'project' }); break;
    case 'all-projects': { const b = scopeNode() ? branchOf(scope()).id : null; openPanel('all-projects', t, { q: '', folded: new Set(N[S.top].children.filter((x) => x !== b && N[x].children.length)) }); break; }
    case 'siblings': openPanel('siblings', t, { id, folded: new Set() }); break;
    case 'sources-more': openPanel('sources', t, { folder: t.dataset.folder || 'project' }); break;
    case 'source-toggle': S.sourceFoldersOpen[sourceFolderKey(id)] = !sourceFolderOpen(id); hover = null; render(); break;
    case 'new-source-folder': closeAll(); open = { kind: 'source-folder', value: '' }; render(); break;
    case 'create-source-folder': createSourceFolder(); break;
    case 'trash': openPanel('trash', t); break;
    case 'sec-projects': S.projectsOpen = !S.projectsOpen; render(); break;
    case 'sec-sources': { const sc = scope(); const ids = SOURCES[sc] || []; const now = sc in S.sourcesOpen ? S.sourcesOpen[sc] : true; S.sourcesOpen[sc] = !now; render(); break; }
    case 'toggle': hover = null; clearTimeout(hoverTimer); if (isOpen(id) && !N[id].children.some((k) => PLAN.shown.has(k))) { openPanel('siblings', t, { id, folded: new Set() }); break; } toggle(id); break;
    case 'tree-fold': {
      const holder = open && (open.kind === 'all-projects' || open.kind === 'siblings') ? open : hover;
      if (holder) { holder.folded = holder.folded || new Set(); if (holder.folded.has(id)) holder.folded.delete(id); else holder.folded.add(id); }
      renderLayer(); break;
    }
    case 'open-project': goProject(id); break;
    case 'open-project-tab': goProject(id, { newTab: true }); break;
    case 'open-item': {
      const it = ITEMS[id];
      if (it.kind === 'note') go({ kind: 'note', id });
      else { closeAll(); render(); toast(it.kind === 'website' ? `Opens ${it.excerpt || it.name} on the Stage.` : `Opens ${it.name} on the Stage.`); }
      break;
    }
    case 'remove-item': { const sc = scope(); const folder = t.dataset.folder; if (folder && folder !== 'project') ITEMS[folder].children = (ITEMS[folder].children || []).filter(x => x !== id); else SOURCES[sc] = (SOURCES[sc] || []).filter((x) => x !== id); render(); toast(`Removed ${ITEMS[id].name} from ${folder && folder !== 'project' ? ITEMS[folder].name : 'this project'}; it stays in the library.`); break; }
    case 'link-item': { attachSource(id); ITEMS[id].flash = Date.now(); render(); break; }
    case 'new-note': {
      const sc = scope(); const nid = `note-${++S.notesMade}`;
      ITEMS[nid] = { id: nid, name: `Untitled Note ${S.notesMade}`, kind: 'note', excerpt: '', flash: Date.now() };
      attachSource(nid, open && open.kind === 'add' ? open.folder : 'project');
      go({ kind: 'note', id: nid }); break;
    }
    case 'add-link': addLink(); break;
    case 'stickies': S.stickiesHidden = !S.stickiesHidden; render(); break;
    case 'restore': S.trash.splice(Number(t.dataset.i), 1); if (!S.trash.length) open = null; render(); break;
    case 'empty-trash': S.trash = []; open = null; render(); break;
    case 'go-agent': goAgent(id); break;
    case 'seen-all': AGENTS.forEach((a) => { if (a.state === 'unseen') a.state = 'done'; }); render(); break;
    case 'go-recent': go({ kind: t.dataset.kind, id }, { newTab: true }); break;
    case 'tab': if (!e.target.closest('[data-act="close-tab"]')) { S.tab = Number(t.dataset.i); const p = page(); if (p.kind === 'project') { openPath(p.id); see(p.id); } closeAll(); render(); } break;
    case 'close-tab': { const i = Number(t.dataset.i); S.tabs.splice(i, 1); if (S.tab >= i && S.tab > 0) S.tab--; const p = page(); if (p.kind === 'project') openPath(p.id); closeAll(); render(); break; }
    case 'new-tab': S.tabs.push({ page: { kind: 'top', id: S.top }, scope: S.top }); S.tab = S.tabs.length - 1; S.expanded = new Set(); remember('top', S.top); closeAll(); render(); break;
    case 'create': hover = null; open = { kind: 'create', parent: t.dataset.parent, value: '' }; render(); break;
    case 'create-go': createProject(); break;
    case 'delete-project': deleteProject(id); break;
    case 'close': open = null; render(); break;
    case 'toast': closeAll(); render(); toast(t.dataset.text); break;
    case 'mock-fold': { const m = $('#mock'); m.dataset.folded = m.dataset.folded === '1' ? '0' : '1'; break; }
    case 'mock-finish': mockAgent('unseen'); break;
    case 'mock-needs': mockAgent('needs'); break;
    case 'mock-run': mockAgent('running'); break;
    case 'mock-ten': for (let k = 0; k < 10; k++) mockAgent('unseen', true); render(); break;
    case 'mock-reset': closeAll(); seed(); render(); break;
    default: break;
  }
});

// A press outside what is open closes it (what opened it toggles it instead, above).
document.addEventListener('mousedown', (e) => {
  if (!open) return;
  if (e.target.closest('#layer [data-layer], #layer .dialog, #hover-layer, #mock')) return;
  if (e.target.closest('[data-veil]') && !e.target.closest('.dialog')) { open = null; render(); return; }
  const trig = e.target.closest('[data-trigger]');
  if (trig) return; // its click toggles it
  if (e.target.closest('#layer')) return;
  open = null; render();
}, true);

document.addEventListener('contextmenu', (e) => {
  const row = e.target.closest('[data-act="open-project"][data-id]');
  if (!row || !row.closest('#rail')) return;
  e.preventDefault();
  hover = null; open = { kind: 'menu', id: row.dataset.id, x: e.clientX, y: e.clientY }; render();
});

document.addEventListener('input', (e) => {
  const k = e.target.dataset.input;
  if (!k || !open) return;
    if (k === 'add-value') { open.value = e.target.value; open.error = ''; }
  else if (k === 'picker-library-q' && open.kind === 'add' && open.library) { open.library.q = e.target.value; }
  else if (k === 'create-name' || k === 'source-folder-name') { open.value = e.target.value; }
  else { open.q = e.target.value; open.idx = 0; }
  renderLayer(true);
});

document.addEventListener('change', (e) => {
  const key = e.target.dataset.model;
  if (!key) return;
  const [p, lv, i] = key.split('.');
  S.models[p][lv][Number(i)] = e.target.value;
});

function endRename(keep) {
  const f = $('[data-rename-top]');
  if (!f || !S.renamingTop) return;
  const name = f.value.trim();
  S.renamingTop = false;
  if (keep && name) { N[S.top].name = name; TOPS.find((x) => x.id === S.top).name = name; }
  render();
}
document.addEventListener('focusout', (e) => { if (e.target.matches && e.target.matches('[data-rename-top]')) endRename(true); });
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && /^[1-9]$/.test(e.key)) {
    const id = numberedProjects()[Number(e.key) - 1];
    if (id) { e.preventDefault(); e.stopPropagation(); if (!e.repeat) goProject(id); }
    return;
  }
  if (e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'j') {
    e.preventDefault(); e.stopPropagation(); if (!e.repeat) nextAgent(); return;
  }
  if (e.target.matches && e.target.matches('[data-rename-top]')) { if (e.key === 'Enter') { e.preventDefault(); endRename(true); } else if (e.key === 'Escape') { e.preventDefault(); endRename(false); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); S.railHidden = !S.railHidden; closeAll(); render(); return; }
  if (e.key === 'Escape') {
    if (open && open.kind === 'add' && open.library) { open.library = null; renderLayer(); return; }
    if (open && open.kind === 'project' && open.sub) { open.sub = null; renderLayer(); return; }
    if (open || hover || shortcutTip) { closeAll(); render(); }
    return;
  }
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'add-value' && e.key === 'Enter') { e.preventDefault(); addLink(); }
  if (k === 'source-folder-name' && e.key === 'Enter') { e.preventDefault(); createSourceFolder(); }
  if (k === 'create-name' && e.key === 'Enter') { e.preventDefault(); createProject(); }
  if (k === 'search-q') {
    const rows = [...document.querySelectorAll('#layer [data-act="go-recent"]')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = rows.length; if (n) { open.idx = ((open.idx || 0) + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; renderLayer(); $('[data-input="search-q"]').focus(); } }
    if (e.key === 'Enter' && rows.length) { e.preventDefault(); const r = rows[Math.min(open.idx || 0, rows.length - 1)]; go({ kind: r.dataset.kind, id: r.dataset.id }); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role="button"], .row[role="switch"], .prow[role="button"]')) { e.preventDefault(); e.target.click(); }
}, true);

// Hovering: a folded project with children shows them beside the sidebar after a beat; a source shows its peek. Both close
// a beat after the pointer leaves the row and the card (the bug was that the children stayed until a press elsewhere).
document.addEventListener('mouseover', (e) => {
  updateShortcutTip(e);
  const inCard = e.target.closest('[data-hover-layer]');
  if (inCard) { clearTimeout(hoverTimer); return; }
  const proj = e.target.closest('#rail [data-hover-project]');
  const src = e.target.closest('[data-peek]');
  const want = proj && proj.dataset.hoverProject && !e.target.closest('.chev, .act') ? { kind: 'fly', id: proj.dataset.hoverProject, el: proj }
    : src && !e.target.closest('.act') ? { kind: 'peek', id: src.dataset.peek, el: src } : null;
  if (want && hover && hover.kind === want.kind && hover.id === want.id) { clearTimeout(hoverTimer); return; }
  if (want && !(open && ['settings', 'search', 'create', 'source-folder', 'menu'].includes(open.kind))) {
    if (want.kind === 'fly' && open && open.kind !== 'clock' && open.kind !== 'project') return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { if (!want.el.isConnected) return; hover = { kind: want.kind, id: want.id, rect: rectOf(want.el) }; renderHoverLayer(); }, hover ? PEEK_SWITCH : PEEK_OPEN);
    return;
  }
  if (hover) { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => { hover = null; renderHoverLayer(); }, PEEK_CLOSE); }
  else clearTimeout(hoverTimer);
});
document.addEventListener('mousemove', updateAddBoundary, true);
document.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); hover = null; clearShortcutTip(); renderHoverLayer(); renderProjectTooltip(); scheduleAddDismissal(); });
window.addEventListener('resize', () => { hover = null; render(); }); // the room is the window's

/* Anything link-shaped or path-shaped; several can be pasted at once, split on whitespace or commas. */
const FILE_EXT = /\.(md|pdf|html?|txt|png|jpe?g|heic|gif|py|js|jsx|ts|tsx|json|csv|tex|docx?|pptx?|xlsx?|zip|sh|css|cjs|mjs|yml|yaml)$/i;
function parseSources(raw) {
  const home = '/Users/hudsonmitchell-pullman';
  return raw.split(/[\s,]+/).filter(Boolean).map((t) => {
    if (/^(~|\/)/.test(t)) return t.startsWith('/') && !t.startsWith(home) ? { t, ok: false, why: 'Only files inside your home directory can be added' } : { t, ok: true, web: false };
    const bare = t.replace(/^https?:\/\//i, '');
    const domain = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(:\d+)?([/?#]\S*)?$/i.test(bare);
    if (/^https?:\/\/\S+/i.test(t) || (domain && !(FILE_EXT.test(bare) && !/[/?#]/.test(bare)))) return { t, ok: true, web: true, url: /^https?:\/\//i.test(t) ? t : `https://${t}` };
    return { t, ok: false, why: `"${t}" is not a link or a path` };
  });
}
function addLink() {
  const parsed = parseSources((open.value || '').trim());
  if (!parsed.length) return;
  const bad = parsed.find((x) => !x.ok);
  const good = parsed.filter((x) => x.ok);
  open.added = open.added || [];
  good.forEach(({ t, web, url }) => {
    const id = `added-${tick()}`;
    const name = web ? url.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[/?#]/)[0] : t.split('/').filter(Boolean).pop() || t;
    const kind = web ? 'website' : /\.pdf$/i.test(t) ? 'pdf' : /\.(png|jpe?g|heic|gif)$/i.test(t) ? 'image' : /\.html?$/i.test(t) ? 'html' : /\.md$/i.test(t) ? 'md' : /\.\w+$/.test(t) ? 'md' : 'folder';
    ITEMS[id] = { id, name, kind, excerpt: web ? url : '', flash: Date.now() };
    attachSource(id, open.folder || 'project');
    open.added.push(id);
  });
  open.value = bad ? bad.t : '';
  open.error = bad ? bad.why : '';
  render(true);
  const field = $('[data-input="add-value"]');
  if (field) { field.focus(); field.setSelectionRange(field.value.length, field.value.length); }
}
function createProject() {
  const name = (open.value || '').trim();
  if (!name) return;
  const parent = N[open.parent];
  const id = `${parent.id}/${slug(name)}-${tick()}`;
  N[id] = { id, name, top: parent.top, parent: parent.id, children: [], level: parent.level + 1, touched: tick() };
  parent.children.push(id);
  S.flash = id; setTimeout(() => { S.flash = null; }, 1700);
  open = null;
  goProject(id);
}
function deleteProject(id) {
  const n = N[id];
  if (!confirm(`Delete ${n.name}${n.children.length ? ' and the projects within it' : ''}?`)) return;
  const gone = Object.keys(N).filter((x) => descends(x, id));
  N[n.parent].children = N[n.parent].children.filter((x) => x !== id);
  gone.forEach((x) => { delete N[x]; });
  AGENTS = AGENTS.filter((a) => N[a.node]);
  S.recent = S.recent.filter((r) => r.kind === 'note' || N[r.id]);
  S.tabs = S.tabs.filter((t) => t.page.kind === 'note' || N[t.page.id]);
  if (!S.tabs.length) S.tabs = [{ page: { kind: 'top', id: S.top }, scope: S.top }];
  S.tab = Math.min(S.tab, S.tabs.length - 1);
  S.tabs.forEach((t) => { if (!N[t.scope]) t.scope = S.top; });
  open = null; render();
}
function mockAgent(state, quiet) {
  const pool = Object.values(N).filter((n) => n.top === S.top && n.level >= 2);
  if (!pool.length) return;
  const node = state === 'running' ? 'engelbart/user-interface/popups' : pool[Math.floor(Math.random() * pool.length)].id;
  const titles = { unseen: ['Breadcrumbs fit the clock', 'Counter says 9+', 'Settings opens in the middle', 'Notes get their own +', 'Folded rows roll up their dot'], needs: ['Which project does + make it in?', 'Clear on open, or on answer?'], running: ['Tab joins the page under it'] };
  const list = titles[state];
  AGENTS.push({ id: `m${tick()}`, title: list[Math.floor(Math.random() * list.length)], node: N[node] ? node : pool[0].id, state, at: Date.now(), model: 'Sonnet · high' });
  if (!quiet) render();
}

seed();
render();
setInterval(() => { if (open && open.kind === 'agents') renderLayer(); }, 30000);
