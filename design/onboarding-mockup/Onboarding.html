const keys=g=>(g.apps.length?g.apps.map(a=>a[0]):['__'+g.id]).filter(n=>!S.failed.has(n));

function persist(){config.revision=DESIGN_REVISION;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(config))}catch{}applyTokens()}

function toolbar(){return S.chrome?`<nav class="dev" aria-label="Mockup controls"><button data-dialog="intro">Intro popup</button><button data-action="work-preview" class="${S.newFlow&&S.screen>=5?'on':''}">Work flow</button><button data-go="2" class="${S.screen===2?'on':''}">Sources</button><button data-action="refine-preview" class="${S.screen===3?'on':''}">Refine</button><span class="divider"></span><select id="preview" aria-label="Preview a popup"><option value="">Popups</option>${[['browser-signin','Browser sign-in'],['cached-signin','Reuse saved sign-in'],['work-roles','Roles'],['work-projects','Recent projects'],['work-tools','Confirm tools'],['work-manual','Manual scopes'],['import-mode','Import method'],['auto-refine','Automatic refine'],['provider-choice','Choose provider'],['provider-both','Both subscribed'],['provider-claude','Only Claude subscribed'],['provider-codex','Only Codex subscribed'],['provider-none','No subscription'],['tools','Tools setup'],['tool-login','Claude Code sign-in'],['tool-consent','Claude Code authorize'],['brain-claude','Claude needs sign-in'],['brain-permission','Notes permission'],['brain-code','Verification code'],['brain-folder','Missing folder'],['intro','Import intro'],['privacy','Privacy'],['apps','All apps'],['folders','Full Disk Access'],['disk-settings','Settings guide'],['disk-missing','App not listed'],['folder-fallback','Deny Full Disk Access'],['chrome','AI sign-ins'],['google','Drive profiles'],['apple','Apple Notes'],['signin','App sign-in'],['permission','macOS access'],['keychain','Keychain'],['keychain-browser','Browser picker'],['keychain-confirm','Decline Keychain'],['denied','Connection failure'],['scratch-confirm','Start confirmation'],['project','New project'],['complete','Import complete']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button data-action="edit" class="${S.edit?'on':''}">Edit</button><button data-action="export">Save HTML</button><button data-action="reset">Reset</button><button class="dev-hide" data-action="hide" aria-label="Hide mockup controls">×</button></nav>`:`<button class="restore" data-action="show">Mockup</button>`}

function importOverlay(){return `<button class="close intro-close" data-action="intro-continue" aria-label="Close introduction">×</button><div class="welcome">${copy('title','h1')}${copy('subtitle','p','class="lead"')}<div class="icons">${WORKS.map(([n,k])=>`<span class="ic" title="${n}">${logo(k,n)}</span>`).join('')}<button class="ic" data-dialog="apps" aria-label="Show all supported apps">+12</button></div><div class="trust">${copy('privacy')}<button class="link under" data-dialog="privacy">Learn more</button></div><div class="actions"><a class="link scratch-link" href="#start-from-scratch" data-dialog="scratch-confirm">${copy('secondary')}</a><button class="btn" data-action="intro-import">${copy('primary')}</button></div></div>`}
function picker(){return `<main class="page picker-page"><div class="col">${copy('pickerTitle','h2')}${S.newFlow?projectScopeStrip():''}<div class="bar"><span>Sources <span style="font-size:10px">⌄</span></span><div class="bar-right"><span style="display:flex;align-items:center;gap:7px">From <span class="select"><button data-menu="period" aria-expanded="${S.menu==='period'}">${S.period}${DOWN}</button>${S.menu==='period'?`<div class="menu" role="menu">${PERIODS.map(p=>`<button role="menuitemradio" aria-checked="${S.period===p}" data-period="${p}">${S.period===p?'✓':'&nbsp;'} ${p}</button>`).join('')}</div>`:''}</span></span><button class="link" data-action="all">${GROUPS.every(g=>keys(g).every(k=>S.picks.has(k)))?'Clear':'Select all'}</button></div></div>${GROUPS.map(g=>{const st=groupState(g);return `<section><div class="group-head"><button class="expand" data-group="${g.id}" aria-expanded="${S.open.has(g.id)}">${CHEV}<span>${g.label}</span></button><button class="cb ${st.on?'on':st.mixed?'mix':''}" role="checkbox" aria-checked="${st.mixed?'mixed':st.on}" aria-label="Select ${g.label}" data-gcheck="${g.id}">${st.on?CHECK:''}</button></div>${S.open.has(g.id)?`<div class="apps">${g.apps.length?g.apps.map(a=>`<button class="app-row" data-app="${esc(a[0])}" role="checkbox" aria-checked="${S.picks.has(a[0])}" ${S.failed.has(a[0])||S.retrying.has(a[0])?'disabled':''}>${logo(a[1])}<span class="app-text">${a[0]}${a[2]?`<small>${sourceHint(a)}</small>`:''}</span>${sourceControl(a[0])}</button>`).join(''):`<button class="app-row" data-app="__sites" role="checkbox" aria-checked="${S.picks.has('__sites')}">${svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 0 0 18 17 17 0 0 0 0-18"/>')}<span class="app-text">Browser history<small>Websites you have visited</small></span>${check(S.picks.has('__sites'))}</button>`}</div>`:''}</section>`}).join('')}<div class="consent"><span class="consent-logo">${logo(S.provider==='Codex'?'codex_light':'claude-ai-icon')}</span><div class="consent-copy">${S.onboardingProvider?`Read with your ${S.onboardingProvider} subscription`:'Use your AI subscription to read these sources'}<p>Uses the plan you already have, so there’s no API key to set up. Saved only on your Mac, and Mathetic never receives it. <button class="link" data-action="leaves" aria-expanded="${S.leaves}">What leaves my Mac?</button></p>${S.leaves?`<div class="leaves">What the agents read is sent to ${S.provider==='Codex'?'OpenAI':'Anthropic'} through your own account to be turned into notes. Your library and those notes are saved on this Mac. Nothing goes to Mathetic.</div>`:''}</div><button class="switch ${S.consent?'on':''}" role="switch" aria-checked="${S.consent}" aria-label="Allow the onboarding provider to read selected sources" data-action="consent"></button></div></div></main><footer class="foot"><div class="foot-inner"><div class="back-skip"><button class="link" data-dialog="scratch-confirm">Start from scratch</button></div><div class="foot-right"><button class="btn" data-action="bring" ${!S.consent||!S.picks.size||S.retrying.size?'disabled':''}>${S.newFlow?'Choose details':copy('bring')}${CHEV}</button></div></div></footer>`}
function editor(){if(!S.edit)return'';return `<aside class="editor" aria-label="Design editor"><div class="modal-head"><h3>Edit this mockup</h3><button class="close" data-action="edit" aria-label="Close editor">×</button></div><p>Click outlined copy to edit in place. Changes save in this browser. Save HTML downloads a standalone copy with your edits.</p>${[['title','Heading'],['subtitle','Description'],['primary','Import button'],['secondary','Start button'],['privacy','Privacy line'],['pickerTitle','Sources heading'],['bring','Import sources button']].map(([k,l])=>`<label for="edit-${k}">${l}</label><${k==='subtitle'?'textarea':'input'} id="edit-${k}" data-edit-copy="${k}" ${k==='subtitle'?'':`value="${esc(config.copy[k])}"`}>${k==='subtitle'?esc(config.copy[k]):''}${k==='subtitle'?'</textarea>':''}`).join('')}${[['heading','Heading size',26,42],['picker','Column width',500,820],['row','Source row height',38,62],['radius','Button radius',0,18]].map(([k,l,min,max])=>`<label>${l} <output id="out-${k}">${config.tokens[k]}px</output></label><input type="range" min="${min}" max="${max}" value="${config.tokens[k]}" data-token="${k}">`).join('')}<label>Ink colour</label><input type="color" value="${config.tokens.ink}" data-token="ink"><label for="demo-json">${S.chatMode==='auto'?'Automatic questions':'Import questions'} (sample JSON)</label><textarea id="demo-json" class="demo-json" spellcheck="false">${esc(JSON.stringify(cardsFor(S.chatMode),null,2))}</textarea><button class="btn secondary" data-action="save-demo">Apply sample questions</button><label for="work-project-json">Project discovery JSON (sample)</label><textarea id="work-project-json" class="demo-json" spellcheck="false">${esc(JSON.stringify(config.workProjects||DEFAULT_WORK_PROJECTS,null,2))}</textarea><label for="work-tool-json">Tool discovery JSON (sample)</label><textarea id="work-tool-json" class="demo-json" spellcheck="false">${esc(JSON.stringify(config.workTools||DEFAULT_WORK_TOOLS,null,2))}</textarea><button class="btn secondary" data-action="save-work-fixtures">Apply discovery data</button><button class="btn" data-action="export">Save edited HTML</button><button class="btn secondary" data-action="restore-design">Restore original design</button></aside>`}
function render(){const y=window.scrollY,toolScroll=document.querySelector('.tool-scroll')?.scrollTop||0;$('#app').innerHTML=(S.screen===10?'':topbar())+(S.screen===5?rolesPage():S.screen===9?workDescriptionPage():S.screen===6?projectsPage():S.screen===7?toolsPage():S.screen===8?manualScopePage():S.screen===10?workspacePage():S.screen===3?chatPage():S.screen===4?workingPage():picker());$('#controls').innerHTML=S.screen===10?'':toolbar();$('#editor-root').innerHTML=S.screen===10?'':editor();document.body.classList.toggle('editing',S.edit);applyTokens();window.scrollTo(0,y);const toolList=document.querySelector('.tool-scroll');if(toolList)toolList.scrollTop=toolScroll}
function summary(){return `<div class="summary">${[...S.picks].map(n=>{const a=GROUPS.flatMap(g=>g.apps).find(a=>a[0]===n);return `<span class="chip">${a?logo(a[1]):''}${esc(n==='__sites'?'Websites':n)}</span>`}).join('')}</div>`}
const buttons=(secondary,primary,action)=>`<div class="mf">${secondary?`<button class="link" data-action="cancel">${secondary}</button>`:''}<button class="btn small" data-action="${action}">${primary}</button></div>`;

// Fixture content only: production gets found items and cards from its agents.
const DEMO_QUESTIONS=[{"id": "notes", "source": "notes", "apps": ["Obsidian"], "kind": "multi", "say": "Looking at the past year of your notes, papers and chats. The sample Obsidian vault has research and personal folders.", "title": "Which Obsidian folders should come in?", "options": [{"label": "Research", "why": "48 notes on learning sciences and HCI"}, {"label": "Project notes", "why": "23 design and implementation notes"}, {"label": "Essays", "why": "12 drafts"}, {"label": "Daily notes", "why": "Personal daily entries"}]}, {"id": "papers", "source": "papers", "apps": ["PDFs on this Mac"], "kind": "multi", "say": "Your selected notes can start importing while we look at papers. These are sample PDF folders.", "title": "Where should I look for papers?", "options": [{"label": "Research papers", "why": "42 PDFs, mostly HCI and learning sciences"}, {"label": "Course readings", "why": "18 textbooks and lecture slides"}, {"label": "Downloads", "why": "27 recent PDFs; personal documents stay out"}]}, {"id": "chats", "source": "chats", "apps": ["Claude", "ChatGPT", "Claude Code", "Codex", "Cursor"], "kind": "single", "say": "I can narrow the AI chats before bringing them in.", "title": "Which AI chats should come in?", "options": [{"label": "Everything from the selected period", "why": "Use the time range you picked"}, {"label": "From particular projects or folders", "why": "Choose the projects next"}, {"label": "Only chats about research", "why": "Keep implementation and research discussions"}]}, {"id": "chat-projects", "source": "chats", "apps": ["Claude", "ChatGPT", "Claude Code", "Codex", "Cursor"], "kind": "multi", "say": "These are sample projects returned by the chat survey.", "title": "Which chat projects should come in?", "options": [{"label": "Engelbart", "why": "Context import and interface design"}, {"label": "Programming education", "why": "Requirements and debugging study"}, {"label": "Learning sciences", "why": "Reading and study design"}]}, {"id": "meetings", "source": "meet", "apps": ["Granola", "Zoom", "Google Meet"], "kind": "single", "say": "The sample meetings include research conversations and project check-ins.", "title": "Do you want full transcripts or just the notes?", "options": [{"label": "Notes only", "why": "The summaries and decisions"}, {"label": "Full transcripts", "why": "The complete conversation"}]}, {"id": "code", "source": "code", "apps": ["GitHub", "Folders on this Mac"], "kind": "repos", "say": "Choose the repositories that belong in this library.", "title": "Which repositories should come in?", "options": [{"label": "papertlab/engelbart-canvas", "why": "Private · updated today"}, {"label": "papertlab/requirements-study", "why": "Private · Python"}, {"label": "papertlab/context-experiments", "why": "Private · TypeScript"}]}, {"id": "sites", "source": "sites", "apps": ["__sites"], "kind": "open", "say": "The sample browser history includes papers, documentation and everyday tools.", "title": "Which topics or sites should I keep?", "placeholder": "For example: HCI papers and Electron documentation…"}];
const AUTO_PLAN=[{name:'Obsidian',logo:'obsidian',title:'Research and project notes',detail:'Related notes from the sample vault; daily notes and personal folders excluded.'},{name:'PDFs on this Mac',logo:'',title:'Papers related to your project',detail:'Research PDFs from the selected period; receipts and forms excluded.'},{name:'Claude Code',logo:'claude-ai-icon',title:'Research and implementation chats',detail:'Sample conversations about the project and its code.'},{name:'Zoom',logo:'zoom',title:'Research meeting notes',detail:'Project decisions and summaries; routine meetings excluded.'},{name:'__sites',logo:'',title:'Referenced papers and documentation',detail:'Sample reading history; mail, calendar and social sites excluded.'}];
const AUTO_QUESTIONS=[{"id": "auto-goal", "source": "intent", "apps": [], "kind": "open", "title": "What are you bringing context in for?", "say": "Tell me about your project. I’ll find the notes, papers and conversations that belong with it.", "placeholder": "For example: studying how novice programmers describe requirements…"}, {"id": "auto-exclusions", "source": "intent", "apps": [], "kind": "open", "title": "Anything I should leave out?", "say": "I’ll focus on context related to that project. Daily notes and personal documents stay out.", "placeholder": "Optional: particular topics, folders or kinds of context…"}];
const cardsFor=mode=>mode==='auto'?(config.autoDemo||AUTO_QUESTIONS):(config.demo||DEMO_QUESTIONS);
function demoCopy(index,path,text){return `<span data-demo-copy="${index}:${path}" ${S.edit?'contenteditable="plaintext-only"':''}>${esc(text||'')}</span>`}
function setDemoCopy(key,value){const [idx,...parts]=key.split(':');const which=S.chatMode==='auto'?'autoDemo':'demo';config[which]||=structuredClone(cardsFor(S.chatMode));let at=config[which][+idx];for(const part of parts.slice(0,-1))at=at[part];at[parts.at(-1)]=value;persist()}
function initChat(mode='context',all=false){S.chatMode=mode;const indices=cardsFor(mode).map((q,i)=>({q,i})).filter(({q})=>mode==='auto'||all||q.apps.some(n=>S.picks.has(n))).map(x=>x.i);S.chat={indices,cursor:0,selections:[],note:'',draft:'',history:[],expanded:new Set(),done:!indices.length,repoSearch:''};S.screen=3;S.dialog=null;S.menu=null;render();drawDialog();window.scrollTo(0,0)}
const PROVIDER_NAMES=['Claude Code','Codex'];
const eligibleProviders=()=>PROVIDER_NAMES.filter(n=>S.providerMeta[n]?.installed&&S.tools.has(n)&&S.providerMeta[n]?.subscription);
function enterRefine(){S.resumeRefine=false;closeDialog();initChat(S.importMode==='auto'?'auto':'context',!!S.previewRefineAll);S.previewRefineAll=false}
function startRefine(){requireProvider('refine')}

function finishIntroPermissions(){S.keychainDecided=true;S.returnDialog=null;closeDialog();S.queue=[];S.afterGates=false;if(S.importMode==='auto')startRefine();else{S.screen=2;render()}}
function seedAutomaticSources(){clearInterval(workTimer);workTimer=null;S.picks=new Set(['Obsidian','PDFs on this Mac','Zoom','Claude Code','Codex','Cursor','__sites']);S.jobs=[];S.needs=[];S.memory='Waiting for imports'}
function generateAutomaticPlan(){const session=S,chat=S.chat;chat.thinking=true;render();clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(S!==session||S.chat!==chat||S.chatMode!=='auto')return;const goal=chat.history.find(h=>cardsFor('auto')[h.index]?.id==='auto-goal');const exclusions=chat.history.find(h=>cardsFor('auto')[h.index]?.id==='auto-exclusions');const omit=(exclusions?.note||'').toLowerCase();const rows=(config.autoPlan||AUTO_PLAN).filter(row=>!((/chat|conversation/.test(omit)&&row.name==='Claude Code')||(/paper|pdf/.test(omit)&&row.name==='PDFs on this Mac')||(/meeting|zoom|transcript/.test(omit)&&row.name==='Zoom')||(/obsidian|all notes/.test(omit)&&row.name==='Obsidian')||(/website|browser|history/.test(omit)&&row.name==='__sites')));chat.goal=goal?.note||'Your recent research projects';chat.exclusions=exclusions?.note||'No additional exclusions';chat.plan=rows;S.picks=new Set(rows.map(row=>row.name));chat.thinking=false;render()},800)}
function automaticPlanMarkup(){const c=S.chat;if(c.thinking)return '<div class="automatic-thinking" role="status"><span class="thinking-dots">•••</span><p>Looking for notes, papers and conversations related to your project…</p></div>';return `<section class="automatic-plan"><h3>Here’s what I’ll bring in</h3><p class="auto-goal">${esc(c.goal||'Your project')}</p>${(c.plan||[]).map(row=>`<div class="automatic-plan-row">${logo(row.logo)}<span><b data-auto-plan-copy="${esc(row.name)}:title" ${S.edit?'contenteditable="plaintext-only"':''}>${esc(row.title)}</b><small data-auto-plan-copy="${esc(row.name)}:detail" ${S.edit?'contenteditable="plaintext-only"':''}>${esc(row.detail)}</small></span></div>`).join('')}<p class="automatic-exclusions">Left out: daily notes, personal documents and unrelated context.${c.exclusions&&c.exclusions!=='No additional exclusions'?` Your exclusions: ${esc(c.exclusions)}.`:''}</p><p class="simulation">Sample plan · the live app’s agents would inspect your sources.</p></section>`}
function beginImportWork(){S.picks.forEach(n=>addJob(n,n==='__sites'?'Websites':n));S.screen=4;S.memory='Waiting for imports';startWorkClock();render();window.scrollTo(0,0)}

function signInProvider(name){S.tools.add(name);S.providerMeta[name]||={};S.providerMeta[name].installed=true;S.providerMeta[name].subscription=true;S.toolState[name]='Signed in'}
function providerScenario(scenario){closeDialog();S.queue=[];S.afterGates=false;S.onboardingProvider=null;S.providerChoice=null;S.tools=new Set(PROVIDER_NAMES);S.providerMeta={'Claude Code':{installed:true,subscription:scenario==='both'||scenario==='claude'},Codex:{installed:true,subscription:scenario==='both'||scenario==='codex'}};S.previewRefineAll=true;startRefine()}

function activeCard(){return S.chat&&!S.chat.done?cardsFor(S.chatMode)[S.chat.indices[S.chat.cursor]]:null}
function currentApps(q){return q.apps.filter(n=>S.picks.has(n))}
function addJob(name,label){if(S.jobs.some(j=>j.name===name))return;S.jobs.push({name,label,progress:0,status:'running'});startWorkClock()}
function startWorkClock(){if(workTimer)return;workTimer=setInterval(()=>{let changes=false;S.jobs.forEach(j=>{if(j.status==='running'){j.progress=Math.min(100,j.progress+8);if(j.progress===100)j.status='done';changes=true}});if(S.screen===4&&!S.jobs.some(j=>j.status==='running'||j.status==='waiting')){if(S.memory==='Waiting for imports'){S.memory='Writing…';changes=true}else if(S.memory==='Writing…'){S.memory='Taking out any secrets…';changes=true}else if(S.memory==='Taking out any secrets…'){S.memory='Saved';changes=true;clearInterval(workTimer);workTimer=null}}if(changes){if(S.screen===4)render();else updateWorkLine()}},800)}
function workText(){const waiting=S.needs.find(n=>!n.resolved&&!n.skipped);if(waiting)return `${waiting.app} needs you`;const running=S.jobs.filter(j=>j.status==='running');if(running.length){const j=running[Math.floor(Date.now()/2600)%running.length];return `Bringing in ${j.label} · ${j.progress}%`}return S.jobs.length?'Settled sources imported':'Looking through your selected sources…'}
function updateWorkLine(){document.querySelectorAll('[data-work-line]').forEach(el=>el.textContent=workText())}
function answerCard(skip=false){const c=S.chat,q=activeCard();if(!q)return;const note=c.note.trim();if(!skip&&!note&&!c.selections.length)return;const index=c.indices[c.cursor];c.history.push({index,selected:[...c.selections],note,skip,text:skip?(S.chatMode==='auto'?(q.id==='auto-exclusions'?'No additional exclusions':'Use recent research context'):'Skipped — left out'):c.selections.concat(note?[note]:[]).join(' · ')});if(S.chatMode==='context'){if(skip){currentApps(q).forEach(n=>S.picks.delete(n));S.jobs=S.jobs.filter(j=>!q.apps.includes(j.name));S.needs.forEach(n=>{if(q.apps.includes(n.app))n.skipped=true})}else{const defer=q.id==='chats'&&c.selections.includes('From particular projects or folders');if(!defer)currentApps(q).forEach(n=>addJob(n,n==='__sites'?'Websites':n))}}c.cursor++;if(S.chatMode==='context')while(c.cursor<c.indices.length){const next=cardsFor(S.chatMode)[c.indices[c.cursor]];if(!currentApps(next).length||next.id==='chat-projects'&&!c.history.some(h=>cardsFor('context')[h.index].id==='chats'&&h.selected.includes('From particular projects or folders'))){c.cursor++;continue}break}c.done=c.cursor>=c.indices.length;c.selections=[];c.note='';c.repoSearch='';if(S.chatMode==='auto'&&c.done){generateAutomaticPlan();return}render();document.querySelector('#question-note')?.focus({preventScroll:true})}
function questionMarkup(q,index,answered=null){const many=q.kind==='multi'||q.kind==='repos',open=q.kind==='open',picks=answered?.selected||S.chat.selections;const options=(q.options||[]).map((o,i)=>({o,i})).filter(({o})=>q.kind!=='repos'||!S.chat.repoSearch||o.label.toLowerCase().includes(S.chat.repoSearch.toLowerCase()));return `<section class="question-card"><div class="question-title">${demoCopy(index,'title',q.title)}</div>${many?'<p class="question-hint">Select all that apply.</p>':''}${q.kind==='repos'&&!answered?`<input class="question-field" id="repo-search" type="search" aria-label="Search sample repositories" placeholder="Search repositories…" value="${esc(S.chat.repoSearch)}">`:''}${!open?`<div class="question-options" role="${many?'group':'radiogroup'}" aria-label="${esc(q.title)}">${options.map(({o,i})=>`<button class="question-option" data-option="${i}" role="${many?'checkbox':'radio'}" aria-checked="${picks.includes(o.label)}" ${answered?'disabled':''}><span class="question-mark ${many?'square':''}"></span><span>${demoCopy(index,`options:${i}:label`,o.label)}${o.why?`<small>${demoCopy(index,`options:${i}:why`,o.why)}</small>`:''}</span></button>`).join('')}</div>`:''}${answered?'':open?`<textarea id="question-note" class="question-field" rows="2" placeholder="${esc(q.placeholder||'In a sentence or two…')}" aria-label="Answer in your own words">${esc(S.chat.note)}</textarea>`:`<input id="question-note" class="question-field" placeholder="Or say it in your own words…" aria-label="Answer in your own words" value="${esc(S.chat.note)}">`}${!answered?`<div class="question-actions"><button class="link" data-action="question-skip">Skip</button><button class="question-submit" data-action="question-submit" ${!S.chat.selections.length&&!S.chat.note.trim()?'disabled':''}>Submit</button></div>`:''}</section>`}
function needMarkup(n){if(n.background)return `<div class="needs-card">${toolLogo(n.app)}<span><b>${esc(toolOf(n.app).name)} ${n.kind==='disk'?'needs file access':n.kind==='permission'?'needs permission':'needs you to sign in'}</b><small>${esc(n.reason)}</small></span><button class="link" data-need-skip="${n.id}">Skip</button><button class="btn small" data-need-open="${n.id}">${n.kind==='signin'?'Log in':'Allow'}</button></div>`;const title=n.kind==='permission'?`${n.app} needs your permission`:n.kind==='folder'?`${n.app} needs its folder`:n.kind==='2fa'?`${n.app} needs you to enter a code`:`${n.app} needs you to sign in`;return `<div class="needs-card">${logo(n.app==='Apple Notes'?'apple':n.app==='Obsidian'?'obsidian':'claude-ai-icon')}<span><b>${title}</b><small>${n.busy?'Waiting for you to finish in your browser…':n.reason}</small></span><button class="link" data-need-skip="${n.id}">Skip</button><button class="btn small" data-need-open="${n.id}">${n.kind==='permission'?'Allow':n.kind==='folder'?'Choose folder':n.kind==='2fa'?'Open':n.busy?'Open page':'Log in'}</button></div>`}
function chatPage(){if(!S.chat)return '';const c=S.chat,q=activeCard(),index=c.indices[c.cursor];return `<main class="brain-page"><div class="brain-column"><div class="brain-head"><button class="link" data-action="brain-back">${CHEV} Back</button><h2>Refine with Engelbart</h2><span class="muted">${S.chatMode==='auto'?'Automatic import · '+S.period:S.period}</span></div><div class="brain-thread">${c.history.map((h,i)=>{const card=cardsFor(S.chatMode)[h.index];return `<div class="answered-turn"><button class="answered-toggle" data-answered="${i}" aria-expanded="${c.expanded.has(i)}">${CHECK}${esc(card.title)}${DOWN}</button>${c.expanded.has(i)?questionMarkup(card,h.index,h):''}<div class="user-bubble">${esc(h.text)}</div></div>`}).join('')}${q?`<div class="agent-turn">${q.say?`<p>${demoCopy(index,'say',q.say)}</p>`:''}${questionMarkup(q,index)}</div>`:S.chatMode==='auto'?automaticPlanMarkup():`<p class="chat-finished">Every selected source has been settled or left out. Imports can finish in the background.</p>`}${S.needs.filter(n=>!n.skipped&&!n.resolved).map(needMarkup).join('')}</div><div class="brain-status"><span class="activity-dot"></span><span data-work-line>${S.chatMode==='auto'?(c.thinking?'Finding relevant context…':c.plan?'Import plan ready':'Understanding your project…'):workText()}</span><span>${c.done?'':`${c.cursor+1} of ${c.indices.length}`}</span></div><footer class="brain-foot"><span class="muted">${S.chatMode==='auto'?'Agents choose context from your instructions':'Imports run in the background'}</span>${S.chatMode!=='auto'||c.done?`<button class="btn ${!c.done?'secondary':''}" data-action="chat-import" ${c.thinking?'disabled':''}>${c.thinking?'Finding context…':c.done?'Bring these in':'Skip the rest'}${CHEV}</button>`:''}</footer></div></main>`}
function workingPage(){const ready=S.memory==='Saved'||S.memory==='Stopped';return `<main class="brain-page"><div class="brain-column"><div class="brain-head"><button class="link" data-action="working-back">${CHEV} Back to questions</button><h2>${ready?'Your context is ready':'Bringing everything in'}</h2><button class="link" data-action="stop-all">Stop all</button></div><div class="working-list">${S.jobs.map(j=>{const a=GROUPS.flatMap(g=>g.apps).find(a=>a[0]===j.name);return `<div class="working-job">${a?logo(a[1]):FOLDER}<span><b>${esc(j.label)}</b><small>${j.status==='done'?'Saved in your library':j.status==='stopped'?'Left where it stopped':j.status==='waiting'?'Waiting for your sign-in':'Reading the selected context'}</small></span><span>${j.status==='running'?j.progress+'%':j.status==='done'?'Done':j.status==='waiting'?'Needs you':'Stopped'}</span>${j.status==='running'?`<button class="link" data-stop-job="${esc(j.name)}">Stop</button>`:''}</div>`}).join('')}<div class="working-job">${KEY}<span><b>MEMORY.md</b><small>Context from the imports</small></span><span>${S.memory}</span></div></div>${S.needs.filter(n=>!n.skipped&&!n.resolved).map(needMarkup).join('')}<div class="brain-foot"><button class="link" data-action="working-background">Run in background</button><button class="btn" data-action="working-done" ${!ready?'disabled':''}>Done${CHEV}</button></div></div></main>`}
function addNeed(kind){const app=kind==='permission'?'Apple Notes':kind==='folder'?'Obsidian':'Claude';const id=Date.now()+Math.random();S.needs.push({id,kind,app,reason:kind==='permission'?'macOS must allow access to Notes.':kind==='folder'?'The vault was not found in the usual folders.':kind==='2fa'?'A sign-in challenge paused the agent.':'The Claude session has expired.'});S.picks.add(app);let j=S.jobs.find(j=>j.name===app);if(!j){addJob(app,app);j=S.jobs.find(j=>j.name===app)}j.status='waiting';render()}
function openNeed(id){const n=S.needs.find(n=>String(n.id)===String(id));S.activeNeed=n;if(!n)return;if(n.kind==='disk'){openDialog('folders',{name:n.app,gate:'folders',fromBackground:true});return}if(n.kind==='permission'&&n.app==='Apple Notes'&&S.grants.has('apple')){resolveNeed();return}if(n.kind==='signin'||n.kind==='connector'){openBrowser(n.app,{fromNeed:true});n.busy=true;render();return}openDialog(n.kind==='permission'?'brain-notes':n.kind==='folder'?'brain-folder-select':'brain-verify',n)}
function resolveNeed(skip=false){if(S.activeNeed?.background){resolveProjectNeed(skip);return}const n=S.activeNeed;if(!n)return;if(skip){n.skipped=true;S.picks.delete(n.app);S.jobs=S.jobs.filter(j=>j.name!==n.app);S.chat.history.push({index:S.chat.indices[S.chat.cursor]||0,selected:[],note:'',skip:true,text:`${n.app} left out`})}else{n.resolved=true;if(n.kind==='permission'&&n.app==='Apple Notes')S.grants.add('apple');else S.signed.add(n.app);const j=S.jobs.find(j=>j.name===n.app);if(j)j.status='running';startWorkClock()}closeDialog();render();S.activeNeed=null}
// Mirrors web-signin.cjs: reuse a saved session, otherwise open the provider directly.
function signInAddress(app){return ({Claude:'claude.ai/login',ChatGPT:'chatgpt.com/auth/login','Google Drive':'accounts.google.com','Google Meet':'accounts.google.com',Gmail:'accounts.google.com',Gemini:'accounts.google.com',Overleaf:'overleaf.com/login','Claude Code':'Claude Code account authorization',Codex:'Codex account authorization'})[app]||`${app} sign-in`}
function openBrowser(app,details={}){S.browserAuth={app,stage:'signin',...details};openDialog('browser-auth',{name:app,...details})}
function browserMarkup(){const b=S.browserAuth||{app:'Claude',stage:'signin'},tool=b.fromTool,displayName=b.fromNeed&&S.newFlow?toolOf(b.app).name:b.app;const a=GROUPS.flatMap(g=>g.apps).find(a=>a[0]===b.app);return `<div class="browser-preview-head"><span class="traffic"><i></i><i></i><i></i></span><span>${S.browserOverride?esc(S.browser):'Default browser'} · Preview</span><button class="close" data-action="browser-close" aria-label="Close sign-in preview">×</button></div><div class="browser-address">${esc(b.fromNeed&&S.newFlow?(toolOf(b.app).website||signInAddress(displayName)):signInAddress(b.app))}</div><div class="browser-login">${b.fromNeed&&S.newFlow?toolLogo(b.app):logo(a?.[1]||(b.app==='Codex'?'codex_light':'claude-ai-icon'))}<h3>${b.stage==='authorize'?`Authorize ${esc(displayName)}`:`Sign in to ${esc(displayName)}`}</h3><p>${b.stage==='authorize'?`Use your ${b.app==='Codex'?'ChatGPT':'Claude'} subscription to run Engelbart’s agents.`:'Continue with an account in your default browser.'}</p>${b.stage==='authorize'?'<button class="btn" data-action="browser-continue">Authorize</button>':'<button class="btn" data-action="browser-continue">Continue with sample account</button>'}<p class="simulation">${tool?'Illustrative provider page. Production uses the CLI’s own browser sign-in.':`${S.browserOverride?'The HTML simulates opening '+S.browser:'The HTML simulates opening the default browser'} and bringing the signed-in session back.`} No credentials are collected.</p></div>`}
function completeBrowser(){const b=S.browserAuth;closeDialog();S.browserAuth=null;if(b.fromTool){signInProvider(b.app);if(S.resumeRefine){requireProvider(S.providerPurpose||'refine')}else{render();toast(`${b.app} signed in`)}}else if(b.fromNeed){resolveNeed()}else{S.signed.add(b.app);S.cached.add(b.app);if(b.gate==='google'){['Google Drive','Google Meet','Gmail','Gemini'].forEach(n=>{S.signed.add(n);S.cached.add(n)})}nextGate()}}
function cancelBrowser(){const b=S.browserAuth;closeDialog();S.browserAuth=null;if(!b)return;if(b.fromTool){S.toolState[b.app]='Sign-in canceled';S.resumeRefine=false;render()}else if(b.fromNeed){if(S.activeNeed)S.activeNeed.busy=false;render()}else{S.picks.delete(b.app);nextGate()}}
function brainPreview(d){if(d==='auto-refine'){clearTimeout(autoTimer);closeDialog();S.importMode='auto';seedAutomaticSources();initChat('auto',true);return true}if(['provider-choice','provider-both','provider-claude','provider-codex','provider-none'].includes(d)){providerScenario(d==='provider-choice'?'both':d.slice(9));return true}if(d==='cached-signin'){closeDialog();S.screen=2;S.cached.add('Claude');S.signed.delete('Claude');S.open.add('chats');pick(['Claude'],true);return true}if(d==='signin'||d==='browser-signin'){S.queue=[];S.afterGates=false;S.screen=2;closeDialog();render();openBrowser('Claude',{name:'Claude',gate:'chrome',preview:true});return true}if(['tools','tool-login','tool-consent'].includes(d)){S.resumeRefine=false;if(d!=='tools'){S.provider='Claude Code';openBrowser(S.provider,{fromTool:true,preview:true,stage:d==='tool-consent'?'authorize':'signin'})}else openDialog(d);return true}if(!d.startsWith('brain-'))return false;if(!S.chat||S.screen!==3)initChat('context',true);addNeed(d==='brain-permission'?'permission':d==='brain-folder'?'folder':d==='brain-code'?'2fa':'signin');return true}
function brainAction(a){switch(a){case'import-mode-back':closeDialog();openDialog('intro');return true;case'import-mode-continue':if(S.modeChoice){S.importMode=S.modeChoice;if(S.importMode==='auto')seedAutomaticSources();if(S.keychainDecided)finishIntroPermissions();else openDialog('keychain',{fromIntro:true,gate:'chrome'})}return true;case'provider-back':S.resumeRefine=false;closeDialog();S.screen=2;render();return true;case'provider-continue':if(eligibleProviders().includes(S.providerChoice)){S.provider=S.providerChoice;S.onboardingProvider=S.provider;enterRefine()}return true;case'keychain-decline':S.grants.delete('keychain');S.cached.clear();if(S.pending?.fromIntro){finishIntroPermissions()}else{const pending=S.pending;closeDialog();if(pending?.name)openBrowser(pending.name,pending);else nextGate()}return true;case'keychain-browser':S.browserChoice=S.browser;S.dialog='keychain-browser';drawDialog();return true;case'keychain-browser-back':S.dialog='keychain';drawDialog();return true;case'keychain-browser-use':S.browser=S.browserChoice;S.browserOverride=true;if(['Firefox','Safari'].includes(S.browser)){toast(`Using ${S.browser} for sign-ins`);if(S.pending?.fromIntro)finishIntroPermissions();else nextGate()}else{S.dialog='keychain';drawDialog()}return true;case'browser-close':cancelBrowser();return true;case'browser-continue':if(S.browserAuth.fromTool&&S.browserAuth.stage==='signin'){S.browserAuth.stage='authorize';drawDialog()}else completeBrowser();return true;case'refine-preview':S.importMode='manual';clearTimeout(autoTimer);clearInterval(timer);S.queue=[];S.afterGates=false;clearRetries();S.picks=new Set(['Obsidian','PDFs on this Mac','Claude','Claude Code','Granola','GitHub','__sites']);initChat('context',true);return true;case'brain-back':if(S.importMode==='auto'){S.modeChoice='auto';openDialog('import-mode')}else{closeDialog();S.screen=2;render()}return true;case'brain-tools':S.resumeRefine=false;openDialog('tools');return true;case'tool-cancel':S.resumeRefine=false;closeDialog();render();return true;case'tool-back':S.toolState[S.provider]='Not signed in';openDialog('tools');return true;case'tool-deny':S.toolState[S.provider]='Sign-in canceled';openDialog('tools');return true;case'tool-browser':openBrowser(S.provider,{fromTool:true});return true;case'tool-authorize':signInProvider(S.provider);openDialog('tools');return true;case'tool-done':if(eligibleProviders().length){closeDialog();if(S.resumeRefine)requireProvider(S.providerPurpose||'refine');else render()}return true;case'question-submit':answerCard();return true;case'question-skip':answerCard(true);return true;case'chat-import':if(S.chat?.thinking)return true;if(S.chatMode==='auto'){S.autoImportPending=true;S.queue=GROUPS.flatMap(g=>g.apps).filter(a=>S.picks.has(a[0])).map(needGate).filter(Boolean);nextGate()}else beginImportWork();return true;case'working-done':closeDialog();S.screen=2;render();toast('Preview complete');return true;case'working-back':S.screen=3;render();return true;case'stop-all':S.jobs.forEach(j=>{if(j.status!=='done')j.status='stopped'});S.memory='Stopped';clearInterval(workTimer);workTimer=null;render();return true;case'working-background':S.screen=2;render();toast('Imports continue in the background');return true;case'need-browser':if(S.activeNeed)S.activeNeed.busy=true;openBrowser(S.activeNeed?.app||'Claude',{fromNeed:true});return true;case'need-cancel':closeDialog();render();return true;case'need-deny':resolveNeed(true);return true;case'need-resolve':resolveNeed();return true;case'need-verify':if(!/^\d{6}$/.test($('#demo-code').value.trim())){$('#code-error').textContent='Enter any six sample digits.'}else resolveNeed();return true;case'save-demo':try{const which=S.chatMode==='auto'?'autoDemo':'demo';const cards=JSON.parse($('#demo-json').value);if(!Array.isArray(cards)||!cards.length||cards.some(q=>!q.title||!['multi','single','open','repos'].includes(q.kind)||!Array.isArray(q.apps)||q.kind!=='open'&&(!Array.isArray(q.options)||!q.options.length||q.options.some(o=>typeof o.label!=='string'))))throw Error();config[which]=cards;persist();initChat(S.chatMode,true);toast('Sample questions saved')}catch{toast('Use a nonempty array of cards with title, kind, apps and choice options.')}return true;default:return false}}

// Work-first onboarding preview. The production scanner/dispatcher supplies these records;
// this standalone file uses editable JSON fixtures and never reads credentials or calls agents.
const WORK_ROLES=[
 ['Researcher','<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/>'],
 ['Writer','<path d="m15 3 6 6L8 22l-6 1 1-6zm-2 2 6 6M5 17l3 3"/>'],
 ['Founder','<rect x="4" y="4" width="16" height="12" rx="2"/><path d="m4 16-2 4h20l-2-4M10 20h4"/>'],
 ['Professor','<path d="m2 8 10-5 10 5-10 5-10-5zm4 3v6c4 3 8 3 12 0v-6m4-3v9"/>'],
 ['Student','<path d="M3 5h6c2 0 3 1 3 3v13c0-2-1-3-3-3H3zm18 0h-6c-2 0-3 1-3 3v13c0-2 1-3 3-3h6z"/>'],
 ['Engineer','<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/>'],
 ['Designer','<rect x="3" y="3" width="7" height="7" rx="1"/><circle cx="17" cy="6.5" r="3.5"/><path d="m6.5 14 4 7h-8z"/><rect x="13.5" y="14" width="7" height="7" rx="3.5"/>'],
 ['Other','<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>']
];
const WORK_CATALOG=GROUPS.flatMap(g=>g.apps.map(a=>({id:a[0],name:a[0],icon:a[1],group:g.id,local:!a[3]||a[3]==='folders'||a[3]==='apple'}))).concat([{id:'__sites',name:'Browser history',icon:'',group:'sites',local:true}]);
const WORK_LOCAL=['Obsidian','Apple Notes','Zoom','Codex','Claude Code','Cursor','PDFs on this Mac','Folders on this Mac','__sites'];
const DEFAULT_WORK_PROJECTS={projects:[
 {id:'engelbart',title:'Engelbart context import',description:'Designing how agents bring project context into a local library.',recent:'Today'},
 {id:'requirements',title:'Programming requirements study',description:'Studying how novice programmers describe and test requirements.',recent:'Yesterday'},
 {id:'reading',title:'Learning sciences reading guide',description:'Organizing research on learning, agency and programming.',recent:'This week'},
 {id:'launch',title:'Engelbart launch',description:'Preparing onboarding, outreach and the first user sessions.',recent:'This week'}
]};
const DEFAULT_WORK_TOOLS={tools:WORK_CATALOG.map(t=>({id:t.id,used:['Notion','Google Drive','Claude','ChatGPT','Zotero','Overleaf','GitHub','Granola','Gmail'].includes(t.id),evidence:'Recent activity in the sample browser session'})),additional:[{name:'Linear',website:'https://linear.app',used:true}]};
const workProjects=()=>[...(S.projectDiscovery?.projects||[]),...S.customProjects];
const selectedWorkProjects=()=>workProjects().filter(p=>S.pickedProjects.has(p.id));
const toolOf=id=>WORK_CATALOG.find(t=>t.id===id)||S.addedTools.find(t=>t.id===id)||{id,name:id,icon:'',local:false};
const toolLogo=id=>{const t=toolOf(id);return t.icon?logo(t.icon):['PDFs on this Mac','Folders on this Mac'].includes(id)?FOLDER:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/>')};
const flowCopy=(key,fallback,tag='span')=>`<${tag} data-flow-copy="${key}" ${S.edit?'contenteditable="plaintext-only"':''}>${esc(config.flowCopy?.[key]||fallback)}</${tag}>`;
function flowHeader(title,key,backAction,sub=''){return `<header class="work-head">${backAction?`<button class="link work-back" data-action="${backAction}">${CHEV} Back</button>`:''}${flowCopy(key,title,'h1')}${sub?`<p>${sub}</p>`:''}</header>`}
function discoveryLine(){const d=S.projectDiscovery;if(!d)return '';const waiting=d.status==='waiting-provider'||d.status==='waiting-browser';return `<div class="discovery-line" role="status"><span class="activity-dot"></span><span>${d.status==='done'?'Recent projects found':d.status==='running'?'Finding recent projects in the background…':d.status==='waiting-browser'?'Waiting for browser access…':'Waiting for your AI provider…'}</span>${waiting?`<button class="link under" data-action="discovery-resume">${d.status==='waiting-provider'?'Connect provider':'Continue'}</button>`:''}</div>`}
function rolesPage(){return `<main class="work-page"><div class="work-column">${flowHeader('What kind of work do you do?','role-title','work-intro','Choose all that apply.')}<div class="role-grid">${WORK_ROLES.map(([name,paths])=>`<button class="role-card" role="checkbox" aria-checked="${S.roles.has(name)}" data-work-role="${name}"><span class="role-icon">${svg(paths)}</span><span>${name}</span>${check(S.roles.has(name))}</button>`).join('')}</div>${discoveryLine()}<footer class="work-foot"><span></span><button class="btn" data-action="roles-next" ${!S.roles.size?'disabled':''}>Continue${CHEV}</button></footer></div></main>`}
function workDescriptionPage(){return `<main class="work-page"><div class="work-column">${flowHeader('What are you working on?','work-description-title','work-description-back')}<textarea id="work-description" class="field" rows="4" aria-label="What are you working on?" placeholder="Describe your work (optional)">${esc(S.workDescription)}</textarea>${discoveryLine()}<footer class="work-foot"><span></span><button class="btn" data-action="work-description-next">Continue${CHEV}</button></footer></div></main>`}
function projectsPage(){const list=workProjects(),ready=S.projectDiscovery?.status==='done';return `<main class="work-page"><div class="work-column">${flowHeader('What project do you want to work on first?','projects-title','projects-back','Select one or more projects, or add your own.')}<div class="project-list">${list.map(p=>`<button class="project-choice" role="checkbox" aria-checked="${S.pickedProjects.has(p.id)}" data-work-project="${esc(p.id)}"><span class="project-symbol">${svg('<path d="M4 4h7l2 2h7v14H4zM8 11h8M8 15h5"/>')}</span><span><b>${esc(p.title)}</b><small>${esc(p.description||'Added by you')}</small></span>${p.recent?`<span class="project-recency">${esc(p.recent)}</span>`:''}${check(S.pickedProjects.has(p.id))}</button>`).join('')}${!ready?`<div class="project-loading">${discoveryLine()}<div class="project-skeleton"></div><div class="project-skeleton"></div></div>`:''}</div><button class="add-project" data-dialog="work-add-project">${svg('<path d="M12 5v14M5 12h14"/>')} Add a project</button><footer class="work-foot"><span class="muted">${S.pickedProjects.size} selected</span><button class="btn" data-action="projects-next" ${!S.pickedProjects.size?'disabled':''}>Continue${CHEV}</button></footer></div></main>`}
function projectScopeStrip(){const projects=selectedWorkProjects();if(!S.newFlow||!projects.length)return '';return `<div class="project-scope-strip"><span>For</span>${projects.map(p=>`<span class="scope-project">${esc(p.title)}</span>`).join('')}<button class="link under" data-action="edit-projects">Edit</button></div>`}
function toolsPage(){const status=S.toolScan?.status,scanned=status==='done',shown=WORK_CATALOG.filter(t=>S.showAllTools||S.confirmedTools.has(t.id)||WORK_LOCAL.includes(t.id));const extra=S.addedTools;return `<main class="work-page tools-page"><div class="work-column">${flowHeader('Confirm your tools','tools-title','tools-back')}<div class="flow-step-label">Automatic import</div>${projectScopeStrip()}${!scanned?'<div class="discovery-line" role="status"><span class="activity-dot"></span>Checking the tools you use in your browser…</div>':''}<div class="tool-scroll" role="region" aria-label="Available tools" tabindex="0"><div class="tool-grid">${shown.concat(extra).map(t=>`<button class="tool-choice" data-work-tool="${esc(t.id)}" role="checkbox" aria-checked="${S.confirmedTools.has(t.id)}">${toolLogo(t.id)}<span><b>${esc(t.name)}</b><small>${t.local?'Found on this Mac':t.source==='user'?'Added by you':t.source==='agent'?'Found in your browser':S.toolScan?.results?.tools.find(r=>r.id===t.id)?.used?'Found in your browser':'Not detected'}</small></span>${check(S.confirmedTools.has(t.id))}</button>`).join('')}</div></div><div class="tool-list-actions"><button class="link under" data-action="show-all-tools">${S.showAllTools?'Show detected tools':'Show all supported tools'}</button><button class="link under" data-dialog="work-add-tool">+ Add a tool</button></div><footer class="work-foot"><span class="muted">${S.confirmedTools.size} tools selected</span><button class="btn" data-action="work-run" ${!scanned||!S.confirmedTools.size?'disabled':''}>Run in background${CHEV}</button></footer></div></main>`}
function scopeKind(id){if(['Obsidian','Zoom','PDFs on this Mac','Folders on this Mac'].includes(id))return 'folders';if(id==='Gmail')return 'email';if(id==='Overleaf')return 'drafts';if(id==='Zotero')return 'collections';if(id==='GitHub')return 'repos';if(['ChatGPT','Claude','Codex','Claude Code','Cursor','Grok','Gemini','Perplexity'].includes(id))return 'chats';return 'documents'}
function ensureScope(id){return S.manualScopes[id]||=( {kind:scopeKind(id),folders:[],items:[],people:[],note:''} )}
function scopeOptions(id){const kind=scopeKind(id);return selectedWorkProjects().flatMap(p=>{if(kind==='drafts')return[{id:`${id}:${p.id}:main`,label:`${p.title} — manuscript`},{id:`${id}:${p.id}:methods`,label:`${p.title} — methods draft`}];if(kind==='email')return[{id:`${id}:${p.id}:collaborators`,label:`Collaborator threads about ${p.title}`}];if(kind==='collections')return[{id:`${id}:${p.id}`,label:`${p.title} collection`}];if(kind==='repos')return[{id:`${id}:${p.id}`,label:p.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')}];if(kind==='chats')return[{id:`${id}:${p.id}`,label:`${p.title} conversations`}];return[{id:`${id}:${p.id}`,label:`${p.title} documents`} ]})}
function scopeReady(id){const s=ensureScope(id);return s.kind==='folders'?s.folders.length>0:s.kind==='email'?s.people.length>0||s.items.length>0:s.items.length>0||!!s.note.trim()}
function manualScopePage(){const sources=[...S.picks],ready=sources.length&&sources.every(scopeReady);return `<main class="work-page"><div class="work-column">${flowHeader('Choose exactly what to bring in','manual-title','manual-scopes-back','Agents will use only the folders, drafts, threads and collections you select.')}<div class="flow-step-label">Manual import</div>${projectScopeStrip()}<div class="manual-source-list">${sources.map(id=>{const t=toolOf(id),scope=ensureScope(id),kind=scope.kind,options=scopeOptions(id);return `<section class="manual-source-card"><div class="manual-source-head">${toolLogo(id)}<h3>${esc(t.name)}</h3><button class="link" data-manual-skip="${esc(id)}">Leave out</button></div>${kind==='folders'?`<p>Choose the ${id==='PDFs on this Mac'?'paper folders':id==='Zoom'?'recording folders':'folders'} to read for these projects.</p><div class="folder-upload"><button class="btn secondary small" data-folder-upload="${esc(id)}">${FOLDER} Choose folder</button><input type="file" webkitdirectory multiple data-scope-files="${esc(id)}" aria-label="Choose a folder for ${esc(t.name)}" hidden><button class="link under" data-sample-folder="${esc(id)}">Use sample folders</button></div><div class="selected-folder-list">${scope.folders.map((f,i)=>`<div>${FOLDER}<span>${esc(f.name)}<small>${f.files} files</small></span><button class="link" data-remove-folder="${esc(id)}" data-folder-index="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}</div>`:`<p>${kind==='email'?'Choose email groups or add specific people. No whole inbox is imported.':kind==='drafts'?'Choose specific Overleaf drafts.':kind==='collections'?'Choose the collections to bring in.':kind==='chats'?'Choose project conversations to read.':'Choose the items to bring in.'}</p>${kind==='email'?`<div class="sender-input"><input class="field" data-sender-input="${esc(id)}" placeholder="Name or email address"><button class="btn secondary small" data-add-sender="${esc(id)}">Add person</button></div><div class="sender-chips">${scope.people.map((p,i)=>`<button data-remove-sender="${esc(id)}" data-sender-index="${i}">${esc(p)} ×</button>`).join('')}</div>`:''}<div class="scope-options">${options.map(o=>`<button class="scope-option" data-scope-option="${esc(id)}" data-scope-item="${esc(o.id)}" role="checkbox" aria-checked="${scope.items.includes(o.id)}">${check(scope.items.includes(o.id))}<span>${esc(o.label)}</span></button>`).join('')}</div><input class="field" data-scope-note="${esc(id)}" placeholder="Or name a specific draft, collection or project…" value="${esc(scope.note)}">`}</section>`}).join('')}</div><footer class="work-foot"><span class="muted">${sources.filter(scopeReady).length} of ${sources.length} sources scoped</span><button class="btn" data-action="work-run" ${!ready?'disabled':''}>Run in background${CHEV}</button></footer></div></main>`}

function startWorkOnboarding(preview=false,methodFirst=true){clearWorkTimers();S.newFlow=true;S.methodBeforeWork=methodFirst;S.roles=new Set();S.workDescription='';S.customProjects=[];S.pickedProjects=new Set();S.confirmedTools=new Set();S.toolsTouched=new Set();S.addedTools=[];S.manualScopes={};S.toolScan=null;S.workspaceNotes={};S.newFlowModeSelected=false;S.discoveryLocal=[...WORK_LOCAL];S.projectDiscovery={requestedAt:Date.now(),status:'waiting-provider',provider:null,projects:[],startedBeforeMode:true};S.screen=methodFirst?2:5;S.dialog=null;S.modeChoice=null;S.importMode='manual';S.queue=[];S.afterGates=false;S.jobs=[];S.needs=[];S.background=null;if(preview){S.tools=new Set(['Claude Code']);S.providerMeta['Claude Code'].subscription=true;S.keychainDecided=true}render();drawDialog();if(methodFirst){const available=eligibleProviders(),chosen=available.includes(S.onboardingProvider)?S.onboardingProvider:available.length===1?available[0]:null;if(chosen){S.provider=chosen;S.onboardingProvider=chosen;S.projectDiscovery.provider=chosen;S.projectDiscovery.status=S.keychainDecided?'running':'waiting-browser'}openDialog('import-mode');if(chosen&&S.keychainDecided)beginProjectDiscovery()}else requireProvider('project-discovery')}
function clearWorkTimers(){clearTimeout(projectTimer);clearTimeout(toolSurveyTimer);clearTimeout(bgPromptTimer);clearInterval(bgTimer);bgTimer=null}
function requireProvider(purpose='refine'){S.providerPurpose=purpose;S.returnDialog=null;const available=eligibleProviders();if(!available.length){S.resumeRefine=true;openDialog('tools');return}if(available.length===1){S.provider=available[0];S.onboardingProvider=S.provider;finishProviderPurpose();return}if(available.includes(S.onboardingProvider)){S.provider=S.onboardingProvider;finishProviderPurpose();return}S.providerChoice=null;S.resumeRefine=true;openDialog('provider-choice')}

function beginProjectDiscovery(){const d=S.projectDiscovery;if(!d)return;if(!S.keychainDecided){d.status='waiting-browser';openDialog('keychain',{fromDiscovery:true});render();return}d.status='running';d.provider=S.onboardingProvider;d.startedAt=Date.now();if(S.modeChoice==='auto'||S.importMode==='auto')beginToolDiscovery();const state=S;clearTimeout(projectTimer);projectTimer=setTimeout(()=>{if(S!==state||!S.newFlow)return;const raw=config.workProjects||DEFAULT_WORK_PROJECTS;d.projects=structuredClone(raw.projects.slice(0,5));d.status='done';d.finishedAt=Date.now();if(S.screen===5||S.screen===9){const line=document.querySelector('.discovery-line');if(line)line.outerHTML=discoveryLine()}else render()},1300);render()}
function beginToolDiscovery(){if(!S.newFlow||S.toolScan?.status==='running'||S.toolScan?.status==='done')return;if(!eligibleProviders().includes(S.onboardingProvider)||!S.keychainDecided){S.toolScan={status:eligibleProviders().includes(S.onboardingProvider)?'waiting-browser':'waiting-provider',requestedAt:S.toolScan?.requestedAt||Date.now(),provider:S.onboardingProvider,results:null};return}S.toolScan={status:'running',startedAt:Date.now(),provider:S.onboardingProvider,results:null};WORK_LOCAL.forEach(id=>{if(!S.toolsTouched.has(id))S.confirmedTools.add(id)});const state=S;clearTimeout(toolSurveyTimer);toolSurveyTimer=setTimeout(()=>{if(S!==state||!S.newFlow)return;const raw=structuredClone(config.workTools||DEFAULT_WORK_TOOLS);const normalized={tools:WORK_CATALOG.map(t=>({id:t.id,used:t.local?WORK_LOCAL.includes(t.id):raw.tools.find(r=>r.id===t.id)?.used===true,method:t.local?'local':'browser'})),additional:raw.additional||[]};S.toolScan.results=normalized;S.toolScan.status='done';normalized.tools.filter(r=>r.used).forEach(r=>{if(!S.toolsTouched.has(r.id))S.confirmedTools.add(r.id)});normalized.additional.filter(t=>t.used).forEach(t=>{const id='custom:'+t.name.toLowerCase();if(!S.addedTools.some(x=>x.id===id))S.addedTools.push({id,name:t.name,website:t.website||'',icon:'',source:'agent',local:false});if(!S.toolsTouched.has(id))S.confirmedTools.add(id)});if(![5,9].includes(S.screen))render()},1400);render()}
function launchProjectImports(){const ids=S.importMode==='auto'?[...S.confirmedTools]:[...S.picks];if(!selectedWorkProjects().length||!ids.length)return;clearInterval(workTimer);workTimer=null;S.background={startedAt:Date.now(),provider:S.onboardingProvider,work:{roles:[...S.roles],description:S.workDescription},projects:selectedWorkProjects().map(p=>({id:p.id,title:p.title,description:p.description})),mode:S.importMode};S.jobs=ids.map(id=>({id:'job:'+id,name:id,label:toolOf(id).name,progress:0,status:'queued',provider:S.onboardingProvider,workRoles:[...S.roles],workDescription:S.workDescription,projectIds:selectedWorkProjects().map(p=>p.id),projectTitles:selectedWorkProjects().map(p=>p.title),scope:S.importMode==='manual'?structuredClone(ensureScope(id)):{kind:'project',period:S.period,onlySelectedProjects:true},plan:`Read only context pertaining to these selected projects: ${selectedWorkProjects().map(p=>p.title).join('; ')}. Exclude unrelated projects, personal files and daily notes. ${S.importMode==='manual'?'Read only the exact folders, people, threads, collections or drafts in the confirmed scope.':'Find relevant material through the existing browser session; do not install a plugin.'}`}));S.needs=[];S.screen=10;S.workspaceTab='document';S.activeProject=selectedWorkProjects()[0].id;S.dialog=null;pumpProjectJobs();render();drawDialog();clearInterval(bgTimer);bgTimer=setInterval(()=>{S.jobs.forEach(j=>{if(j.status==='running'){j.progress=Math.min(100,j.progress+12);if(j.progress===100)j.status='done'}});pumpProjectJobs();if(S.screen===10){if(S.workspaceTab==='library')render();else updateWorkspaceStatus()}if(S.dialog==='work-import-status')updateImportStatusModal();if(S.jobs.every(j=>['done','stopped','failed'].includes(j.status))){clearInterval(bgTimer);bgTimer=null;S.memory='Saved';if(S.screen===10)updateWorkspaceStatus()}},850);clearTimeout(bgPromptTimer);bgPromptTimer=setTimeout(()=>{const n=S.needs.find(n=>!n.resolved&&!n.skipped);if(n&&!S.dialog&&S.screen= function pumpProjectJobs(){if(!S.background)return;let slots=3-S.jobs.filter(j=>j.status==='running'||j.status==='waiting').length;for(const j of S.jobs){if(slots<=0)break;if(j.status!=='queued')continue;const t=toolOf(j.name);if(!t.local&&!S.signed.has(j.name)&&!S.cached.has(j.name)){queueProjectNeed(j,'signin');slots--;continue}if(j.name==='Apple Notes'&&!S.grants.has('apple')){queueProjectNeed(j,'permission');slots--;continue}if(S.importMode==='auto'&&['Obsidian','PDFs on this Mac','Folders on this Mac'].includes(j.name)&&!S.grants.has('full-disk')&&!S.folderFinished){queueProjectNeed(j,'disk');slots--;continue}j.status='running';slots--}}
function queueProjectNeed(job,kind){job.status='waiting';if(!S.needs.some(n=>n.jobId===job.id&&!n.skipped&&!n.resolved))S.needs.push({id:'need:'+job.id,jobId:job.id,kind,app:job.name,reason:`For ${job.projectTitles.join(' and ')}`,background:true})}

function resolveDiskProjectNeeds(){const allowed=S.grants.has('full-disk')||Object.values(S.folderAnswers).some(Boolean);S.needs.filter(n=>n.kind==='disk'&&!n.skipped&&!n.resolved).forEach(n=>{const j=S.jobs.find(j=>j.id===n.jobId);const canRead=allowed&&(n.app==='PDFs on this Mac'||S.grants.has('full-disk')||S.folderAnswers.Documents===true);if(canRead){n.resolved=true;if(j){j.scope.allowedFolders=S.grants.has('full-disk')?'full-disk':Object.keys(S.folderAnswers).filter(f=>S.folderAnswers[f]);j.status='queued'}}else{n.skipped=true;if(j)j.status='stopped'}});S.activeNeed=null;closeDialog();pumpProjectJobs();render()}

function workAction(a){if(a==='import-mode-back'&&S.newFlow){closeDialog();if(S.methodBeforeWork){S.screen=2;openDialog('intro')}else{S.screen=S.pickedProjects.size?6:5}render();return true}if(a==='refine-preview'&&S.newFlow){closeDialog();if(!S.pickedProjects.size)S.screen=6;else if(S.importMode==='manual')S.screen=8;else{S.screen=7;beginToolDiscovery()}render();return true}if(a==='provider-back'&&S.newFlow){S.resumeRefine=false;closeDialog();render();return true}switch(a){case'intro-import':startWorkOnboarding();return true;case'work-preview':startWorkOnboarding(true);return true;case'work-intro':closeDialog();S.screen=2;openDialog('intro');render();return true;case'roles-next':if(S.roles.size){S.screen=9;render();window.scrollTo(0,0)}return true;case'work-description-back':S.screen=5;render();return true;case'work-description-next':S.screen=6;render();window.scrollTo(0,0);return true;case'projects-back':S.screen=9;render();return true;case'projects-next':if(S.pickedProjects.size){if(!S.newFlowModeSelected){S.methodBeforeWork=false;S.modeChoice=null;openDialog('import-mode')}else if(S.importMode==='auto'){S.screen=7;beginToolDiscovery();render()}else{S.screen=2;render()}}return true;case'edit-projects':S.screen=6;render();return true;case'work-modal-close':closeDialog();return true;case'save-custom-project':{const title=$('#custom-project-title').value.trim();if(!title){$('#custom-project-title').focus();return true}const id='user-project:'+Date.now();S.customProjects.push({id,title:title.slice(0,80),description:$('#custom-project-description').value.trim().slice(0,500)});S.pickedProjects.add(id);closeDialog();render();return true}case'show-all-tools':S.showAllTools=!S.showAllTools;render();return true;case'save-custom-tool':{const name=$('#custom-tool-name').value.trim().slice(0,60),website=$('#custom-tool-website').value.trim();if(!name){$('#custom-tool-name').focus();return true}if(website&&!/^https?:\/\//i.test(website)){toast('Use a website beginning with htt function openDialog(kind,pending=null){if(kind==='apple'){if(S.grants.has('apple')&&!pending?.preview){nextGate();return}kind='apple-permission'}if(['chrome','google','signin'].includes(kind)&&pending&&!pending.preview){if(S.cached.has(pending.name)){S.signed.add(pending.name);toast(`${pending.name} signed in using the saved account`);nextGate();return}openBrowser(pending.name||'Claude',{...pending,gate:pending.gate||kind});return}if(kind==='denied'){startRetries(pending||{name:'Notion',gate:'signin'});return}if(S.dialog==='intro'&&['privacy','apps','project','scratch-confirm'].includes(kind))S.returnDialog='intro';else if(kind==='intro')S.returnDialog=null;lastFocus=document.activeElement;S.menu=null;S.dialog=kind;S.pending=pending;S.profile=0;drawDialog()}

function action(a){if(workAction(a))return;if(brainAction(a))return;switch(a){case'intro-import':S.returnDialog=null;S.queue=[];S.afterGates=false;S.modeChoice=null;openDialog('import-mode');break;case'intro-continue':S.returnDialog=null;closeDialog();render();break;case'cancel':cancelled();break;case'edit':S.edit=!S.edit;render();break;case'settings-edit':closeDialog();S.edit=true;render();break;case'export':exportHtml();break;case'hide':S.chrome=false;S.edit=false;render();break;case'show':S.chrome=true;render();break;case'reset':clearWorkTimers();clearTimeout(autoTimer);clearInterval(timer);clearInterval(workTimer);workTimer=null;clearRetries();S=fresh();render();drawDialog();toast('Preview state reset');break;case'restore-design':config=structuredClone(DEFAULT);persist();render();toast('Original design restored');break;case'all':{const all=GROUPS.flatMap(keys);pick(all,!all.every(n=>S.picks.has(n)));break}case'leaves':S.leaves=!S.leaves;render();break;case'consent':S.consent=!S.consent;render();break;case'bring':if(S.consent&&S.picks.size&&!S.retrying.size){S.queue=GROUPS.flatMap(g=>g.apps).filter(a=>S.picks.has(a[0])).map(needGate).filter(Boolean);S.afterGates=true;nextGate()}break;case'disk-deny':S.dialog='folder-fallback';drawDialog();break;case'disk-open':S.dialog='disk-settings';drawDialog();break;case'disk-missing':S.diskListed=false;S.dialog='disk-settings';drawDialog();break;case'disk-choose':S.dialog='disk-add';drawDialog();break;case'disk-add':S.diskListed=true;S.dialog='disk-settings';drawDialog();break;case'disk-toggle':S.dialog='disk-auth';drawDialog();break;case'disk-auth':S.diskEnabled=true;S.dialog='disk-relaunch';drawDialog();break;case'disk-relaunch':S.grants.add('full-disk');S.grants.add('folders');S.folderFinished=true;FOLDERS.forEach(f=>{S.grants.add(f);S.folderAnswers[f]=true});toast('Full Disk Access allowed');nextGate();break;case'disk-help':S.diskHelp=!S.diskHelp;drawDialog();break;case'folder-fallback':S.dialog='folder-fallback';drawDia
