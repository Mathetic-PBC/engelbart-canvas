<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Yellow sticky note</title>
  <desc id="desc">A blank, unbranded yellow paper note with a gently lifted lower corner, fine paper texture, and soft shadows on a transparent background.</desc>
  <defs>
    <linearGradient id="paper" x1="125" y1="60" x2="351" y2="427" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff5a0"/>
      <stop offset=".24" stop-color="#ffed78"/>
      <stop offset=".64" stop-color="#ffe365"/>
      <stop offset=".88" stop-color="#f8d64f"/>
      <stop offset="1" stop-color="#eac23d"/>
    </linearGradient>
    <linearGradient id="adhesive" x1="0" y1="64" x2="0" y2="131" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c6a337" stop-opacity=".13"/>
      <stop offset=".24" stop-color="#dbb843" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff2a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(138 101) rotate(55) scale(322 306)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbd7" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff5ba" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lower-bow" x1="256" y1="354" x2="253" y2="433" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a47b17" stop-opacity="0"/>
      <stop offset=".61" stop-color="#b28b20" stop-opacity=".025"/>
      <stop offset=".85" stop-color="#fff2a2" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff7b2" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="curl" x1="374" y1="353" x2="407" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5922a"/>
      <stop offset=".18" stop-color="#ddba48"/>
      <stop offset=".44" stop-color="#fff0a1"/>
      <stop offset=".68" stop-color="#fff5b4"/>
      <stop offset=".87" stop-color="#f7df7b"/>
      <stop offset="1" stop-color="#d4ac35"/>
    </linearGradient>
    <linearGradient id="edge" x1="78" y1="73" x2="407" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbd0" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffec93" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a78224" stop-opacity=".4"/>
    </linearGradient>
    <filter id="shadow-soft" x="-30%" y="-50%" width="170%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="shadow-near" x="-20%" y="-30%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="curl-shadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0" intercept=".43"/>
        <feFuncG type="linear" slope="0" intercept=".34"/>
        <feFuncB type="linear" slope="0" intercept=".11"/>
        <feFuncA type="linear" slope=".065"/>
      </feComponentTransfer>
    </filter>
    <path id="sheet" d="M82 66 C175 63 324 64 429 70 C428 151 433 259 426 345 C417 369 393 400 361 419 C278 428 173 425 77 418 C82 315 80 169 82 66Z"/>
    <clipPath id="paper-clip"><use href="#sheet"/></clipPath>
  </defs>
  <g transform="rotate(-5 256 256)">
    <!-- The increasing shadow distance follows the paper lifting off the surface. -->
    <path d="M93 100 L421 103 L431 410 Q265 452 88 431Z" fill="#3e341c" opacity=".19" filter="url(#shadow-soft)"/>
    <path d="M86 73 Q255 69 426 77 L425 111 Q252 104 84 107Z" fill="#392c10" opacity=".20" filter="url(#shadow-near)"/>
    <path d="M85 175 C84 272 85 355 80 420 Q187 434 288 427 L292 415 L90 404Z" fill="#493710" opacity=".12" filter="url(#shadow-near)"/>
    <!-- A hairline edge gives the sheet thickness without a drawn outline. -->
    <use href="#sheet" transform="translate(0 1.2)" fill="#c7a238"/>
    <use href="#sheet" fill="url(#paper)"/>
    <g clip-path="url(#paper-clip)">
      <path d="M74 61 H439 V133 H74Z" fill="url(#adhesive)"/>
      <use href="#sheet" fill="url(#light)"/>
      <path d="M71 350 H438 V436 H71Z" fill="url(#lower-bow)"/>
      <path d="M358 424 C380 392 375 370 372 350 C388 361 405 358 424 346 C416 378 389 411 358 424Z" fill="#8a6515" opacity=".20" filter="url(#curl-shadow)"/>
      <path d="M75 60 H437 V432 H75Z" filter="url(#paper-grain)" opacity=".62"/>
    </g>
    <path d="M82.5 67 C184 64 324 65 428 70.5" stroke="#fffbd1" stroke-opacity=".8" stroke-width="1.25"/>
    <path d="M82 68 C80 171 82 315 77.5 417.5 C171 424.5 278 427 361 419" stroke="url(#edge)" stroke-width=".9"/>
    <!-- A continuous curved underside, with no straight diagonal fold. -->
    <path d="M361 419 C375 402 380 379 374 354 C391 359 411 355 426 345 C417 369 393 400 361 419Z" fill="url(#curl)"/>
    <path d="M374 354 C391 359 411 355 426 345" stroke="#fff5b5" stroke-width="1.05" stroke-opacity=".85"/>
    <path d="M361 419 C385 405 413 374 426 345" stroke="#b69129" stroke-width=".75" stroke-opacity=".58"/>
    <path d="M362 418 C376 400 380 379 374 355" stroke="#fff5b3" stroke-width=".85" stroke-opacity=".65"/>
  </g>
</svg>
