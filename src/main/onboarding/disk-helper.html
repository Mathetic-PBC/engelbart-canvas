<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Full Disk Access</title>
<!-- The helper docked beside System Settings (./disk-access.cjs). Round 3 (2026-10-13): the review mockup's coach, and only
     that ("get rid of all this highlighted text and it should just say Toggle Setting also make the arrow like way thicker"):
     the app's icon, "Toggle Setting", a close button, and a thick arrow toward Settings. -->
<style>
:root{--ink:#171717;--mute:#8f8f8f;--font:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;overflow:hidden}
.wrap{position:absolute;inset:14px 14px 14px 70px;display:flex;align-items:center}
.coach{position:relative;width:100%;background:#fff;border:1px solid #ddd;border-radius:12px;padding:22px;box-shadow:0 12px 40px #0002;-webkit-app-region:drag}
.coach button{-webkit-app-region:no-drag}
.icon{width:30px;height:30px;border-radius:7px;display:block}
h3{margin:15px 0 0;font-size:19px;line-height:1.3;letter-spacing:-.3px;font-weight:600}
.close{position:absolute;top:12px;right:12px;font-size:20px;line-height:1;border:0;background:transparent;color:var(--mute);cursor:pointer}
.close:hover{color:var(--ink)}
.arrow{position:absolute;left:4px;top:50%;width:62px;height:24px;margin-top:-12px;color:var(--ink);animation:nudge 1.2s ease-in-out infinite}
.arrow path{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.right .wrap{inset:14px 70px 14px 14px}.right .arrow{left:auto;right:4px;transform:scaleX(-1)}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:-6px 0}}
.right .arrow{animation-name:nudge-right}@keyframes nudge-right{0%,100%{translate:0 0}50%{translate:6px 0}}
</style>
</head>
<body>
<svg class="arrow" viewBox="0 0 62 24" aria-hidden="true"><path d="M58 12H6m12-9-12 9 12 9"/></svg>
<div class="wrap"><aside class="coach" id="panel">
  <button class="close" data-action="close" aria-label="Handle permission later">×</button>
  <img class="icon" id="icon" alt="" hidden>
  <h3 id="title">Toggle Setting</h3>
</aside></div>
<script>
let state = {};
const $ = (id) => document.getElementById(id);
function draw() {
  if (state.icon) { $('icon').src = state.icon; $('icon').hidden = false; }
  document.body.classList.toggle('right', state.side === 'right');
  $('title').textContent = state.done ? 'Full Disk Access is on' : 'Toggle Setting';
}
window.diskHelper.onState((next) => { state = next || state; draw(); });
document.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-action]');
  if (button) window.diskHelper.action(button.dataset.action);
});
draw();
</script>
</body>
</html>
