# Temporary (docs/windows-port-log.md): where the macOS runner's 35 s reverse lookup of 127.0.0.1 comes from, and what
# makes it quick. Removed once ci.yml has the fix.
name: Probe macOS lookup
on:
  push:
    branches: [windows-port]
    paths: ['.github/workflows/probe-mac-lookup.yml']
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Probe
        shell: bash
        run: |
          t() { local s=$SECONDS; "$@" > /tmp/out 2>&1; echo "[$((SECONDS - s)) s] $* => $(head -c 300 /tmp/out | tr '\n' ' ')"; }
          fq='import socket, time; t = time.time(); r = socket.gethostbyaddr("127.0.0.1"); print(r, round(time.time() - t, 2))'
          sw_vers; python3 --version; hostname; scutil --get HostName || true; scutil --get LocalHostName || true
          cat /etc/hosts; scutil --dns | head -30; cat /etc/resolv.conf || true
          t dscacheutil -q host -a ip_address 127.0.0.1
          t dscacheutil -q host -a name localhost
          t dig -x 127.0.0.1 +time=2 +tries=1
          t host 127.0.0.1
          t python3 -c "$fq"
          t python3 -c 'import socket; print(socket.getnameinfo(("127.0.0.1", 0), 0))'
          t python3 -c 'import socket; print(socket.getnameinfo(("127.0.0.1", 0), socket.NI_NAMEREQD))'
          t python3 -c 'import socket; print(socket.gethostbyaddr("::1"))'
          t /usr/bin/python3 -c "$fq"
          echo '--- restart mDNSResponder'; sudo killall mDNSResponder || true; sleep 3; t python3 -c "$fq"
          echo '--- HostName and LocalHostName set to localhost-like names'; sudo scutil --set HostName runner.local; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; sleep 2; t python3 -c "$fq"
          echo '--- no multicast'; sudo defaults write /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements -bool true; sudo killall mDNSResponder || true; sleep 3; t python3 -c "$fq"
          echo '--- pf blocks mDNS (udp 5353)'; echo 'block drop out quick proto udp to any port 5353' | sudo pfctl -ef - 2>&1 | tail -1; sleep 1; t python3 -c "$fq"
          sudo pfctl -d || true
          echo '--- the log of mDNSResponder while a lookup runs'
          sudo log stream --predicate 'process == "mDNSResponder"' --style compact > /tmp/mdns.log 2>&1 & pid=$!
          sleep 2; t python3 -c "$fq"; sleep 1; sudo kill $pid || true
          grep -iE 'in-addr|127\.0\.0\.1|PTR|timeout|localhost' /tmp/mdns.log | head -60
