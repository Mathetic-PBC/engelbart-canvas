# CI (2026-10-05, MATH-26): npm ci, npm test and npm run build on macOS, Windows and Linux. Windows also packages the
# installer (kept as an artifact) and runs scripts/smoke-windows.cjs against the packaged app; the Mac packages the app
# for the runner's architecture, signed ad hoc. Linux (2026-10-07, docs/windows-port-log.md "Linux") counts like the
# other two: it packages the AppImage (kept as an artifact), smoke tests it under xvfb, and installs it with the
# one-line command. docs/windows-port.md.
name: CI

on:
  push:
    branches: [windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test/sandbox-pipeline-benchmark.test.cjs reads earlier commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A hung apt mirror once held this step for the job's whole hour: each try is cut off after 4 minutes, with apt's
      # own retries and timeouts, and tried again (3 times). zsh: the tests of the login shell and its integration
      # run the real one, as on a Mac.
      - name: Linux packages for node-pty, Electron and the tests
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          for try in 1 2 3; do
            sudo timeout 240 apt-get "${apt_opts[@]}" update && sudo timeout 240 apt-get "${apt_opts[@]}" install -y xvfb libnss3 libgbm1 libasound2t64 zsh && exit 0
            echo "apt-get failed (try $try); trying again"; sleep 15
          done
          exit 1
      - run: npm ci
      # A runner's first python3 takes seconds to start, longer than a test's dev server is given to answer
      # (test/run-step.test.cjs serves a page with `python3 -m http.server`).
      # The tests run it in the login shell, whose PATH can name another python3 (on the Mac, Xcode's): that one too.
      - name: Warm up python3
        shell: bash
        run: |
          python3 -c "import http.server" && python3 --version
          if [ "$RUNNER_OS" = macOS ]; then zsh -ilc 'command -v python3; python3 -c "import http.server"; python3 --version'; fi
      # http.server looks its address's name up (socket.getfqdn) before it listens. On the macOS runner Homebrew's
      # python3 (first on the login shell's PATH) waits 35 s for any name lookup, while Apple's /usr/bin/python3 and
      # dscacheutil answer at once (runs 5-6 and the probe of 2026-10-05: /etc/hosts and DNS servers made no
      # difference; macOS holds a non-Apple program's lookups, as for Local Network access no one can grant on a
      # runner). The page test gives its server 8 s, so the tests get Apple's python3: a folder holding only it, first
      # in /etc/paths, which the login shell's path_helper puts first.
      - name: Apple's python3 for the tests (macOS runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apple-python3"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/apple-python3/python3"
          { echo "$RUNNER_TEMP/apple-python3"; cat /etc/paths; } > "$RUNNER_TEMP/paths" && sudo cp "$RUNNER_TEMP/paths" /etc/paths
          echo "$RUNNER_TEMP/apple-python3" >> "$GITHUB_PATH"
          zsh -ilc 'command -v python3; python3 --version; python3 -c "import socket, time; t = time.time(); socket.getfqdn(\"127.0.0.1\"); print(\"getfqdn(127.0.0.1): %.2f s\" % (time.time() - t))"'
      - name: Time the page test's server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          start=$SECONDS
          (cd "$RUNNER_TEMP" && HOME="$RUNNER_TEMP" zsh -ilc 'python3 -m http.server 8765 --bind 127.0.0.1' > /dev/null 2>&1 &)
          until curl -s -o /dev/null http://127.0.0.1:8765/ || [ $((SECONDS - start)) -gt 90 ]; do sleep 0.2; done
          echo "python3 -m http.server answered after $((SECONDS - start)) s"
          pkill -f 'http.server 8765' || true
      # Git for Windows turns LF into CRLF on checkout (core.autocrlf in its system config). The app's own git turns that
      # off for itself (src/main/build/git.cjs); this is for the git commands the tests run themselves to make their
      # repositories, which compare files byte for byte, as a Mac's git leaves them.
      # Its system config also names Git Credential Manager as a credential helper, which waits for someone to sign in
      # (test/build-git.test.cjs asks for a credential the way a person's own helper answers it, as on a Mac).
      - name: Keep LF in the tests' repositories, and no sign-in prompt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --system core.autocrlf false
          git config --system --get-all credential.helper || true
          git config --system --unset-all credential.helper || true
      - name: npm test
        shell: bash
        # A test that hangs fails after 15 minutes instead of holding the job to its limit. The limit holds for a whole
        # test file too: build.test.cjs takes 175 s on a Windows runner, and twice that on a slow one (run 11).
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test -- --test-timeout=900000; else npm test -- --test-timeout=900000; fi
      - run: npm run build

      - name: Package the Mac app
        if: runner.os == 'macOS'
        env:
          ENGELBART_SIGN: adhoc
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package

      # The installer is made as a release is (scripts/package-windows.mjs: a production build, its update feed
      # latest.yml), and kept: `npm run upload:win` takes both from the green run of the release commit.
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        env:
          ENGELBART_DOWNLOAD_URL: https://mathetic.com/engelbart
        run: npm run dist:win
      - name: Smoke test the packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows.cjs release/win-unpacked/Engelbart.exe
      # The one-line install as a person runs it (scripts/install-windows.ps1), against the installer above served from
      # a folder here: first in Windows PowerShell 5.1, which every Windows has; then the installed copy is smoke
      # tested; then again in PowerShell 7, which must stop at "already installed".
      - name: Install with the one-line command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $site = Join-Path $env:RUNNER_TEMP 'engelbart-site'
          node scripts/release-site.mjs windows release $version https://mathetic.com/engelbart/ - $site
          if ($LASTEXITCODE) { throw 'release-site.mjs could not write the folder' }
          Get-ChildItem $site | Format-Table Name, Length
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $site -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 100; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/latest.yml | Out-Null; break } catch { Start-Sleep -Milliseconds 200 } }
            $env:ENGELBART_DOWNLOADS = 'http://127.0.0.1:8765/'
            $env:ENGELBART_NO_OPEN = '1'
            $first = powershell.exe -NoProfile -ExecutionPolicy Bypass -Command 'irm http://127.0.0.1:8765/install.ps1 | iex; exit $LASTEXITCODE' | Out-String
            $code = $LASTEXITCODE
            Write-Host $first
            if ($code -ne 0 -or $first -notmatch "Engelbart $([regex]::Escape($version)) is installed in ") { throw "the first install did not install Engelbart (exit code $code)" }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\Engelbart\Engelbart.exe'
            if (-not (Test-Path -LiteralPath $exe)) { throw "Engelbart is not at $exe" }
            Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'Engelbart*' | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
            node scripts/smoke-windows.cjs $exe
            if ($LASTEXITCODE) { throw 'the installed copy did not pass the smoke test' }
            $again = & { irm http://127.0.0.1:8765/install.ps1 | iex } 6>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $again
            if ($code -ne 0 -or $again -notmatch "Engelbart $([regex]::Escape($version)) is already installed in .+ and up to date\.") { throw "the second run did not stop as up to date (exit code $code)" }
            if ($again -match 'Downloading') { throw 'the second run downloaded the installer again' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      # The AppImage is made as a release is (scripts/package-linux.mjs: a production build, its update feed
      # latest-linux.yml), and kept: `npm run upload:linux` takes both from the green run of the release commit.
      - name: Package the Linux AppImage
        if: runner.os == 'Linux'
        env:
          ENGELBART_DOWNLOAD_URL: https://mathetic.com/engelbart
        run: npm run dist:linux
      - name: Smoke test the packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-linux.cjs release/linux-unpacked/engelbart-launch
      # The one-line install as a person runs it on Linux: the Mac's command (install.sh hands Linux to
      # install-linux.sh), against the AppImage above served from a folder here. The installed copy is smoke tested, the
      # command run again must stop at "already installed", and where AppArmor keeps the sandbox off, the profile the
      # install command offers is added (with the runner's sudo) and the sandbox must then be on.
      - name: Install with the one-line command (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          site="$RUNNER_TEMP/engelbart-site"
          node scripts/release-site.mjs linux release "$version" https://mathetic.com/engelbart/ - - - "$site"
          ls -l "$site"
          (cd "$site" && exec python3 -m http.server 8766 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          for i in $(seq 1 100); do curl -fs -o /dev/null http://127.0.0.1:8766/latest-linux.yml && break; sleep 0.2; done
          export ENGELBART_DOWNLOADS=http://127.0.0.1:8766/ ENGELBART_NO_OPEN=1
          ENGELBART_APPARMOR=no bash -c 'curl -fsSL http://127.0.0.1:8766/install.sh | bash' | tee "$RUNNER_TEMP/first.txt"
          grep -q "^Engelbart $version is installed in $HOME/.local/share/engelbart" "$RUNNER_TEMP/first.txt"
          test -x "$HOME/.local/share/engelbart/app/engelbart"
          test "$(readlink "$HOME/.local/bin/engelbart")" = "$HOME/.local/share/engelbart/app/engelbart-launch"
          cat "$HOME/.local/share/applications/engelbart.desktop"
          ls "$HOME"/.local/share/icons/hicolor/*/apps/engelbart.png
          sandbox=$(sed -n "s/^Chromium's sandbox: \(on\|off\):.*/\1/p" "$RUNNER_TEMP/first.txt")
          SMOKE_SANDBOX=$sandbox xvfb-run -a node scripts/smoke-linux.cjs "$HOME/.local/bin/engelbart"
          bash -c 'curl -fsSL http://127.0.0.1:8766/install.sh | bash' | tee "$RUNNER_TEMP/again.txt"
          grep -q "^Engelbart $version is already installed in $HOME/.local/share/engelbart and up to date\.$" "$RUNNER_TEMP/again.txt"
          if grep -q Downloading "$RUNNER_TEMP/again.txt"; then echo "the second run downloaded the AppImage again"; exit 1; fi
          if grep -q "^Chromium's sandbox: off: AppArmor" "$RUNNER_TEMP/first.txt"; then
            ENGELBART_FORCE=1 ENGELBART_APPARMOR=yes bash -c 'curl -fsSL http://127.0.0.1:8766/install.sh | bash' | tee "$RUNNER_TEMP/third.txt"
            grep -q "^Chromium's sandbox: on: the AppArmor profile /etc/apparmor.d/engelbart-$(id -u) lets Engelbart make user namespaces\.$" "$RUNNER_TEMP/third.txt"
            cat "/etc/apparmor.d/engelbart-$(id -u)"
            SMOKE_SANDBOX=on xvfb-run -a node scripts/smoke-linux.cjs "$HOME/.local/bin/engelbart"
          fi
          pkill -f 'http.server 8766' || true
      - name: Keep the AppImage
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: engelbart-linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: warn
      - name: Keep the installer
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: engelbart-windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: warn
