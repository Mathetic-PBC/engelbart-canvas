# CI (2026-10-05, MATH-26): npm ci, npm test and npm run build on macOS, Windows and Linux. Windows also packages the
# installer (kept as an artifact) and runs scripts/smoke-windows.cjs against the packaged app; the Mac packages the app
# for the runner's architecture, signed ad hoc. Linux is reported but allowed to fail. docs/windows-port.md.
name: CI

on:
  push:
    branches: [windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test/sandbox-pipeline-benchmark.test.cjs reads earlier commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages for node-pty and Electron
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64
      - run: npm ci
      # A runner's first python3 takes seconds to start, longer than a test's dev server is given to answer
      # (test/run-step.test.cjs serves a page with `python3 -m http.server`).
      # The tests run it in the login shell, whose PATH can name another python3 (on the Mac, Xcode's): that one too.
      - name: Warm up python3
        shell: bash
        run: |
          python3 -c "import http.server" && python3 --version
          if [ "$RUNNER_OS" = macOS ]; then zsh -ilc 'command -v python3; python3 -c "import http.server"; python3 --version'; fi
      # http.server looks its address's name up (socket.getfqdn) before it listens. On the macOS runner Homebrew's
      # python3 (first on the login shell's PATH) waits 35 s for any name lookup, while Apple's /usr/bin/python3 and
      # dscacheutil answer at once (runs 5-6 and the probe of 2026-10-05: /etc/hosts and DNS servers made no
      # difference; macOS holds a non-Apple program's lookups, as for Local Network access no one can grant on a
      # runner). The page test gives its server 8 s, so the tests get Apple's python3: a folder holding only it, first
      # in /etc/paths, which the login shell's path_helper puts first.
      - name: Apple's python3 for the tests (macOS runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apple-python3"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/apple-python3/python3"
          { echo "$RUNNER_TEMP/apple-python3"; cat /etc/paths; } > "$RUNNER_TEMP/paths" && sudo cp "$RUNNER_TEMP/paths" /etc/paths
          echo "$RUNNER_TEMP/apple-python3" >> "$GITHUB_PATH"
          zsh -ilc 'command -v python3; python3 --version; python3 -c "import socket, time; t = time.time(); socket.getfqdn(\"127.0.0.1\"); print(\"getfqdn(127.0.0.1): %.2f s\" % (time.time() - t))"'
      - name: Time the page test's server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          start=$SECONDS
          (cd "$RUNNER_TEMP" && HOME="$RUNNER_TEMP" zsh -ilc 'python3 -m http.server 8765 --bind 127.0.0.1' > /dev/null 2>&1 &)
          until curl -s -o /dev/null http://127.0.0.1:8765/ || [ $((SECONDS - start)) -gt 90 ]; do sleep 0.2; done
          echo "python3 -m http.server answered after $((SECONDS - start)) s"
          pkill -f 'http.server 8765' || true
      # Git for Windows turns LF into CRLF on checkout (core.autocrlf in its system config). The app's git drops GIT_*
      # variables (src/main/build/git.cjs), so GIT_CONFIG_NOSYSTEM from scripts/test.mjs doesn't reach it; the tests'
      # repositories compare files byte for byte, as a Mac's git leaves them.
      # Its system config also names Git Credential Manager as a credential helper, which waits for someone to sign in
      # (test/build-git.test.cjs asks for a credential the way a person's own helper answers it, as on a Mac).
      - name: Keep LF in the tests' repositories, and no sign-in prompt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --system core.autocrlf false
          git config --system --get-all credential.helper || true
          git config --system --unset-all credential.helper || true
      - name: npm test
        shell: bash
        # A test that hangs fails after 15 minutes instead of holding the job to its limit. The limit holds for a whole
        # test file too: build.test.cjs takes 175 s on a Windows runner, and twice that on a slow one (run 11).
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test -- --test-timeout=900000; else npm test -- --test-timeout=900000; fi
      - run: npm run build

      - name: Package the Mac app
        if: runner.os == 'macOS'
        env:
          ENGELBART_SIGN: adhoc
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package

      - name: Package the Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
      - name: Smoke test the packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows.cjs release/win-unpacked/Engelbart.exe
      - name: Keep the installer
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: engelbart-windows-installer
          path: release/*.exe
          if-no-files-found: warn
