# CI (2026-10-05, MATH-26): npm ci, npm test and npm run build on macOS, Windows and Linux. Windows also packages the
# installer (kept as an artifact) and runs scripts/smoke-windows.cjs against the packaged app; the Mac packages the app
# for the runner's architecture, signed ad hoc. Linux is reported but allowed to fail. docs/windows-port.md.
name: CI

on:
  push:
    branches: [windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test/sandbox-pipeline-benchmark.test.cjs reads earlier commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages for node-pty and Electron
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64
      - run: npm ci
      # A runner's first python3 takes seconds to start, longer than a test's dev server is given to answer
      # (test/run-step.test.cjs serves a page with `python3 -m http.server`).
      # The tests run it in the login shell, whose PATH can name another python3 (on the Mac, Xcode's): that one too.
      - name: Warm up python3
        shell: bash
        run: |
          python3 -c "import http.server" && python3 --version
          if [ "$RUNNER_OS" = macOS ]; then zsh -ilc 'command -v python3; python3 -c "import http.server"; python3 --version'; fi
      # http.server looks its address's name up (socket.getfqdn) before it listens. On the macOS runner that lookup
      # (127.0.0.1's name) took 35 s (run 5), so http.server answered after 35 s and the
      # page test, which gives it 8, failed. The runner's resolver is fixed until the lookup is quick: 127.0.0.1's names
      # in /etc/hosts, then public DNS servers. Each is tried only while the lookup is still slow; the log says which.
      - name: Quick reverse lookups (macOS runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          slow() { python3 -c "import socket, sys, time; t = time.time(); socket.getfqdn('127.0.0.1'); s = time.time() - t; print('getfqdn(127.0.0.1): %.2f s' % s); sys.exit(0 if s > 2 else 1)"; }
          flush() { sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true; sleep 1; }
          hostname; scutil --dns | grep -m4 nameserver || true
          if slow; then
            echo "Adding 127.0.0.1's names to /etc/hosts"
            printf '127.0.0.1 localhost %s\n::1 localhost\n' "$(hostname)" | sudo tee -a /etc/hosts
            flush
          fi
          if slow; then
            echo "Public DNS servers for every network service"
            networksetup -listallnetworkservices | tail -n +2 | sed 's/^\*//' | while read -r service; do sudo networksetup -setdnsservers "$service" 1.1.1.1 8.8.8.8 || true; done
            flush
          fi
          slow && echo "Still slow: the page test will fail" || true
      - name: Time the page test's server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          start=$SECONDS
          (cd "$RUNNER_TEMP" && HOME="$RUNNER_TEMP" zsh -ilc 'python3 -m http.server 8765 --bind 127.0.0.1' > /dev/null 2>&1 &)
          until curl -s -o /dev/null http://127.0.0.1:8765/ || [ $((SECONDS - start)) -gt 90 ]; do sleep 0.2; done
          echo "python3 -m http.server answered after $((SECONDS - start)) s"
          pkill -f 'http.server 8765' || true
      # Git for Windows turns LF into CRLF on checkout (core.autocrlf in its system config). The app's git drops GIT_*
      # variables (src/main/build/git.cjs), so GIT_CONFIG_NOSYSTEM from scripts/test.mjs doesn't reach it; the tests'
      # repositories compare files byte for byte, as a Mac's git leaves them.
      - name: Keep LF in the tests' repositories (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.autocrlf false
      - name: npm test
        shell: bash
        # A test that hangs fails after five minutes instead of holding the job to its limit.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test -- --test-timeout=300000; else npm test -- --test-timeout=300000; fi
      - run: npm run build

      - name: Package the Mac app
        if: runner.os == 'macOS'
        env:
          ENGELBART_SIGN: adhoc
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package

      - name: Package the Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
      - name: Smoke test the packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows.cjs release/win-unpacked/Engelbart.exe
      - name: Keep the installer
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: engelbart-windows-installer
          path: release/*.exe
          if-no-files-found: warn
